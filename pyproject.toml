[project]
name = "openlet-tooling"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pyyaml",
  "psycopg[binary]",
  "temporalio",
  "authzed",
  "boto3",
  "qdrant-client",
]

[tool.uv.workspace]
members = ["packages/sdk-python", "apps/letfs-ingest"]

[dependency-groups]
dev = ["grpcio-tools", "pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/*_pb2*.py" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/letfs-ingest/tests"]
