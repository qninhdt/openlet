[project]
name = "openlet-tooling"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "openlet-sdk",
  "pyyaml",
  "psycopg[binary]",
  "temporalio",
  "authzed",
  "boto3",
  "qdrant-client",
]

[tool.uv.workspace]
members = ["packages/sdk-python", "apps/letfs-ingest", "apps/leta"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.2",
    "grpcio-tools",
    "mypy-protobuf>=5.1.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-grpcio>=1.85.0.20261028",
    "types-lxml>=2026.2.16",
    "types-protobuf>=7.35.1.20260906",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/*_pb2*.py" = ["ALL"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/letfs-ingest/tests", "packages/sdk-python/tests"]

[tool.pyright]
include = ["apps/letfs-ingest", "apps/leta", "packages/sdk-python/src/openlet_sdk", "packages/sdk-python/tests", "scripts"]
exclude = ["**/__pycache__", "archive", "packages/sdk-python/src/openlet_api", "packages/sdk-python/src/buf"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["packages/sdk-python/src", "apps/leta/src", "apps/letfs-ingest/src"]
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.uv.sources]
openlet-sdk = { workspace = true }
