    "/internal/v1/filesystems/{fs}/files/{action}": {
      "post": {
        "operationId": "filePrimitive",
        "security": [
          {
            "serviceToken": []
          }
        ],
        "parameters": [
          {
            "name": "fs",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "action",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "stat",
                "list",
                "batch-stat",
                "trash-list",
                "directories",
                "text",
                "rename",
                "move",
                "replace-text",
                "trash",
                "restore",
                "purge",
                "copy",
                "content",
                "uploads-create",
                "uploads-finalize",
                "uploads-abort",
                "uploads-status",
                "processing-status",
                "processing-retry",
                "search",
                "semantic-search"
              ]
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "scope": {
                        "type": "object",
                        "properties": {
                          "actor_id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "mounts": {
                            "type": "array",
                            "minItems": 1,
                            "maxItems": 32,
                            "items": {
                              "type": "object",
                              "properties": {
                                "path": {
                                  "type": "string"
                                },
                                "filesystem_id": {
                                  "type": "string",
                                  "format": "uuid"
                                }
                              },
                              "required": [
                                "path",
                                "filesystem_id"
                              ],
                              "additionalProperties": false
                            }
                          }
                        },
                        "required": [
                          "actor_id",
                          "mounts"
                        ],
                        "additionalProperties": false
                      },
                      "input": {
                        "type": "object",
                        "properties": {
                          "locator": {
                            "$ref": "#/components/schemas/Locator"
                          },
                          "parent": {
                            "$ref": "#/components/schemas/Locator"
                          },
                          "name": {
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          },
                          "revision": {
                            "type": "string",
                            "pattern": "^(0|[1-9][0-9]*)$"
                          },
                          "request_key": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "entry_id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "cursor": {
                            "type": "string"
                          },
                          "limit": {
                            "type": "integer",
                            "minimum": 1,
                            "maximum": 100
                          },
                          "locators": {
                            "type": "array",
                            "maxItems": 100,
                            "items": {
                              "$ref": "#/components/schemas/Locator"
                            }
                          },
                          "storage": {
                            "enum": [
                              "inline",
                              "object"
                            ]
                          },
                          "size_bytes": {
                            "type": "string",
                            "pattern": "^(0|[1-9][0-9]*)$"
                          },
                          "content_md5": {
                            "type": "string",
                            "minLength": 24,
                            "maxLength": 24
                          },
                          "parts": {
                            "type": "array",
                            "maxItems": 10000,
                            "items": {
                              "$ref": "#/components/schemas/UploadReceipt"
                            }
                          },
                          "stage": {
                            "enum": [
                              "enrichment",
                              "index"
                            ]
                          }
                        },
                        "required": [],
                        "additionalProperties": false
                      }
                    },
                    "required": [
                      "scope",
                      "input"
                    ],
                    "additionalProperties": false
                  },
                  {
                    "$ref": "#/components/schemas/SearchRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Scoped result"
          },
          "201": {
            "description": "Created"
          },
          "204": {
            "description": "Purged"
          },
          "206": {
            "description": "Byte range"
          },
          "default": {
            "description": "Error",
            "content": {
