[project]
name = "openlet-evals"
version = "0.1.0"
description = "Standalone evaluation framework for Openlet capabilities (retrieval, agent tasks)."
requires-python = ">=3.14,<3.15"
dependencies = [
  "deepeval==4.3.5",
  "httpx>=0.28.1",
  "jinja2>=3.1.0",
  "numpy>=2.2.0",
  "openai>=1.70.0",
  "openlet-env",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.2",
  "qdrant-client>=1.16.0",
]

[project.scripts]
openlet-eval = "openlet_evals.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlet_evals"]

[tool.uv.sources]
openlet-env = { path = "../packages/env", editable = true }
openlet-sdk = { path = "../packages/sdk-python", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (Astral official list)
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    "ISC001",
    # Intentional enterprise exclusions
    "CPY",
    "TRY003",
    "EM101",
    "EM102",
    "D105",
    "D107",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.RootModel",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "SLF001", "ARG", "D", "DOC", "FBT", "INP001"]
"**/cli.py" = ["T201"]
"**/__main__.py" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:deepeval.*",
  "ignore::SyntaxWarning:deepeval.*",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src", "../packages/env/src", "../packages/sdk-python/src"]
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportPropertyTypeMismatch = "error"
reportDeprecated = "error"
