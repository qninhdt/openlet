syntax = "proto3";
package openlet_api.leta.v1;

option go_package = "github.com/qninhdt/openlet/packages/go/gen/openlet_api/leta/v1;letav1";

service LetaService {
  // Workspace-only, actor-free canonical resource lookup, including deletion.
  rpc GetLetaBinding(GetLetaBindingRequest) returns (GetLetaBindingResponse);
  // Workspace-only, actor-free teardown inventory and acknowledged producer stop.
  rpc ListWorkspaceLeta(ListWorkspaceLetaRequest) returns (ListWorkspaceLetaResponse);
  rpc StopLetaForWorkspaceDeletion(StopLetaForWorkspaceDeletionRequest) returns (StopLetaForWorkspaceDeletionResponse);
}

message GetLetaBindingRequest {
  string leta_id = 1;
}

message GetLetaBindingResponse {
  string leta_id = 1;
  string kind = 2;
  string workspace_id = 3;
  string created_by_user_id = 4;
  string home_scope_id = 5;
  string status = 6;
}

message ListWorkspaceLetaRequest {
  string workspace_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListWorkspaceLetaResponse {
  string workspace_id = 1;
  repeated string leta_ids = 2;
  optional string next_cursor = 3;
}

message StopLetaForWorkspaceDeletionRequest {
  string workspace_id = 1;
  string leta_id = 2;
}

message StopLetaForWorkspaceDeletionResponse {
  string workspace_id = 1;
  string leta_id = 2;
  string status = 3;
}
