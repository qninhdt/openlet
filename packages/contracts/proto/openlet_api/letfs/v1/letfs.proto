syntax = "proto3";
package openlet.letfs.v1;
option go_package = "github.com/qninhdt/openlet/packages/sdk-go/gen/openlet_api/letfs/v1;letfsv1";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "buf/validate/validate.proto";

enum StorageVisibility { STORAGE_VISIBILITY_UNSPECIFIED = 0; STORAGE_VISIBILITY_PRIVATE = 1; STORAGE_VISIBILITY_PUBLIC = 2; }
enum StorageRole { STORAGE_ROLE_UNSPECIFIED = 0; STORAGE_ROLE_OWNER = 1; STORAGE_ROLE_EDITOR = 2; STORAGE_ROLE_VIEWER = 3; }
enum NodeKind { NODE_KIND_UNSPECIFIED = 0; NODE_KIND_DIRECTORY = 1; NODE_KIND_FILE = 2; }
enum FileType { FILE_TYPE_UNSPECIFIED = 0; FILE_TYPE_TEXT = 1; FILE_TYPE_BLOB = 2; }
message ActorRef { oneof actor { option (buf.validate.oneof).required = true; string user_id = 1 [(buf.validate.field).string.uuid = true]; string agent_id = 2 [(buf.validate.field).string.uuid = true]; } }
message StorageOwnership { oneof owner { string user_id = 1; string agent_id = 2; string workspace_id = 3; } }
message StorageCapabilities { bool read = 1; bool write = 2; bool manage_access = 3; }
message Storage { string id = 1; string workspace_id = 2; string name = 3; StorageVisibility visibility = 4; string root_node_id = 5; bool allow_blob_files = 6; bool allow_indexing = 7; StorageCapabilities capabilities = 8; StorageOwnership owner = 9; }
message WorkspaceStorage { string workspace_id = 1; int64 quota_bytes = 2; int64 used_bytes = 3; }
message AccessGrant { ActorRef actor = 1; StorageRole role = 2; }
message StorageAccess { StorageOwnership ownership = 1; repeated AccessGrant grants = 2; StorageVisibility visibility = 3; }
message NodeLocator { oneof locator { option (buf.validate.oneof).required = true; string node_id = 1 [(buf.validate.field).string.uuid = true]; string path = 2; } optional string root_node_id = 3 [(buf.validate.field).string.uuid = true]; optional string cwd_node_id = 4 [(buf.validate.field).string.uuid = true]; }
message FileMetadata { optional string title = 1; optional string description = 2; optional string semantic_type = 3; optional string context = 4; }
message ProcessingSummary { string stage = 1; optional string error_code = 2; }
message FileHeader { FileType type = 1; int64 version = 2; int64 size_bytes = 3; string media_type = 4; FileMetadata metadata = 5; ProcessingSummary processing = 6; }
message Node { string id = 1; string storage_id = 2; optional string parent_id = 3; string name = 4; NodeKind kind = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; bool readonly = 8; FileHeader file = 9; }
message WorkspaceStorageRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; }
message UpdateStorageQuotaRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; int64 quota_bytes = 2 [(buf.validate.field).int64.gte = 0]; }
message StorageRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; }
message ListStoragesRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 3; optional StorageVisibility visibility = 4; bool owned_only = 5; }
message ListStoragesResponse { repeated Storage storages = 1; string next_page_token = 2; }
message UpdateStorageRequest {
 string workspace_id = 1 [(buf.validate.field).string.uuid = true];
 string storage_id = 2 [(buf.validate.field).string.uuid = true];
 string name = 3 [(buf.validate.field).string = {min_len: 1, max_bytes: 255}];
}
message SetStorageAccessRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; ActorRef actor = 3 [(buf.validate.field).required = true]; StorageRole role = 4 [(buf.validate.field).enum = {in: [2,3]}]; }
message RevokeStorageAccessRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; ActorRef actor = 3 [(buf.validate.field).required = true]; }
message NodeRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator target = 3 [(buf.validate.field).required = true]; }
message BatchStatRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; repeated NodeLocator targets = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 100}]; }
message StatResult { oneof result { Node node = 1; google.rpc.Status error = 2; } }
message BatchStatResponse { repeated StatResult results = 1; }
message ListNodesRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator parent = 3 [(buf.validate.field).required = true]; int32 page_size = 4 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 5; }
message ListNodesResponse { repeated Node nodes = 1; string next_page_token = 2; }
message ReadTreeRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator root = 3 [(buf.validate.field).required = true]; uint32 max_depth = 4 [(buf.validate.field).uint32 = {gte: 1, lte: 32}]; uint32 max_nodes = 5 [(buf.validate.field).uint32 = {gte: 1, lte: 1000}]; }
message TreeEntry { Node node = 1; string path = 2; uint32 depth = 3; }
message ReadTreeResponse { repeated TreeEntry entries = 1; bool truncated = 2; }
message TextContent { string content = 1; string media_type = 2; }
message CreateNodeRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator parent = 3 [(buf.validate.field).required = true]; string name = 4 [(buf.validate.field).string = {min_len: 1, max_len: 255, not_in: [".",".."], pattern: "^[^/\\x00]+$"}]; oneof content { option (buf.validate.oneof).required = true; google.protobuf.Empty directory = 5; TextContent text = 6; } string request_id = 7 [(buf.validate.field).string.uuid = true]; }
message CreateDirectoriesRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator base = 3 [(buf.validate.field).required = true]; string path = 4 [(buf.validate.field).string.min_len = 1]; reserved 5; reserved "request_id"; }
message TransferNodeRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator source = 3 [(buf.validate.field).required = true]; string destination_storage_id = 4 [(buf.validate.field).string.uuid = true]; NodeLocator parent = 5 [(buf.validate.field).required = true]; string name = 6 [(buf.validate.field).string = {min_len: 1, max_len: 255, not_in: [".",".."], pattern: "^[^/\\x00]+$"}]; string request_id = 7 [(buf.validate.field).string.uuid = true]; }
message ByteRange { int64 offset = 1 [(buf.validate.field).int64.gte = 0]; optional int64 length = 2 [(buf.validate.field).int64.gte = 0]; }
message LineRange { uint32 first = 1 [(buf.validate.field).uint32.gte = 1]; uint32 count = 2; }
message ReadTextRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator target = 3 [(buf.validate.field).required = true]; oneof selection { ByteRange bytes = 4; LineRange lines = 5; uint32 head_lines = 6; uint32 tail_lines = 7; } bool include_metrics = 8; }
message TextMetrics { int64 bytes = 1; int64 lines = 2; }
message ReadTextResponse { string content = 1; int64 version = 2; TextMetrics metrics = 3; }
message TextEdit { int64 start_byte = 1 [(buf.validate.field).int64.gte = 0]; int64 end_byte = 2 [(buf.validate.field).int64.gte = 0]; string replacement = 3; }
message TextPatch { repeated TextEdit edits = 1; }
message TextOverwrite { int64 offset = 1 [(buf.validate.field).int64.gte = 0]; string content = 2; }
message TextReplace { string old_text = 1 [(buf.validate.field).string.min_len = 1]; string new_text = 2; bool replace_all = 3; }
message MutateTextRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator target = 3 [(buf.validate.field).required = true]; oneof mutation { option (buf.validate.oneof).required = true; string replace = 4; string append = 5; TextPatch patch = 6; int64 truncate_bytes = 7 [(buf.validate.field).int64.gte = 0]; TextOverwrite overwrite = 10; TextReplace literal_replace = 11; } optional int64 expected_version = 8 [(buf.validate.field).int64.gt = 0]; string request_id = 9 [(buf.validate.field).string.uuid = true]; }
message ReadImageRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator target = 3 [(buf.validate.field).required = true]; uint32 max_width = 4 [(buf.validate.field).uint32.lte = 4096]; uint32 max_height = 5 [(buf.validate.field).uint32.lte = 4096]; }
message SignedDownload { string url = 1; google.protobuf.Timestamp expires_at = 2; }
message TextDownload { string filename = 1; string media_type = 2; string content = 3; }
message GetDownloadResponse { oneof download { SignedDownload blob = 1; TextDownload text = 2; } }
message DownloadArchiveRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; repeated NodeLocator targets = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 100}]; }
message SearchFilesRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator root = 3 [(buf.validate.field).required = true]; string query = 4 [(buf.validate.field).string.min_len = 1]; int32 page_size = 5 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 6; bool case_sensitive = 7; }
message SearchFilesResponse { repeated Node hits = 1; string next_page_token = 2; }
message TextSearchRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator root = 3 [(buf.validate.field).required = true]; string query = 4 [(buf.validate.field).string.min_len = 1]; int32 page_size = 5 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 6; bool case_sensitive = 7; bool lines_mode = 8; }
message TextHit { Node node = 1; string snippet = 2; uint32 line_number = 3; string path = 4; }
message TextSearchResponse { repeated TextHit hits = 1; string next_page_token = 2; }
message SemanticSearchRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator root = 3 [(buf.validate.field).required = true]; string query = 4 [(buf.validate.field).string.min_len = 1]; uint32 top_k = 5 [(buf.validate.field).uint32 = {gte: 1,lte: 100}]; }
message SemanticHit { Node node = 1; string snippet = 2; double score = 3; string path = 4; }
message SemanticSearchResponse { repeated SemanticHit hits = 1; }
message TrashNodeRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; NodeLocator target = 3 [(buf.validate.field).required = true]; string request_id = 4 [(buf.validate.field).string.uuid = true]; }
message TrashEntry { string id = 1; Node node = 2; optional string original_parent_id = 3; ActorRef trashed_by = 4; google.protobuf.Timestamp trashed_at = 5; }
message ListTrashRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 4; }
message ListTrashResponse { repeated TrashEntry entries = 1; string next_page_token = 2; }
message RestoreTrashRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; string trash_id = 3 [(buf.validate.field).string.uuid = true]; NodeLocator parent = 4; optional string name = 5 [(buf.validate.field).string = {min_len: 1, max_len: 255, not_in: [".",".."], pattern: "^[^/\\x00]+$"}]; }
message PurgeTrashRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; string trash_id = 3 [(buf.validate.field).string.uuid = true]; }
message UploadCreate { NodeLocator parent = 1 [(buf.validate.field).required = true]; string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, not_in: [".",".."], pattern: "^[^/\\x00]+$"}]; }
message UploadReplace { NodeLocator target = 1 [(buf.validate.field).required = true]; int64 expected_version = 2 [(buf.validate.field).int64.gt = 0]; }
message CreateUploadRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; oneof destination { option (buf.validate.oneof).required = true; UploadCreate create = 3; UploadReplace replace = 4; } int64 size_bytes = 5 [(buf.validate.field).int64.gte = 0]; string media_type = 6 [(buf.validate.field).string.min_len = 1]; string checksum = 7 [(buf.validate.field).string.min_len = 1]; string request_id = 8 [(buf.validate.field).string.uuid = true]; }
message SignedPart { uint32 part_number = 1; string url = 2; map<string,string> headers = 3; }
message UploadPart { uint32 part_number = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 10000}]; string checksum = 2 [(buf.validate.field).string.min_len = 1]; }
message TransferDescriptor { string put_url = 1; map<string,string> headers = 2; bool multipart = 3; int64 part_size_bytes = 4; }
message Upload { string id = 1; google.protobuf.Timestamp expires_at = 2; TransferDescriptor transfer = 3; Node completed = 4; }
message UploadRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; string upload_id = 3 [(buf.validate.field).string.uuid = true]; }
message SignPartsRequest {
  option (buf.validate.message).cel = {id: "parts.unique", message: "part numbers must be unique", expression: "this.parts.map(p, p.part_number).unique()"};
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string storage_id = 2 [(buf.validate.field).string.uuid = true];
  string upload_id = 3 [(buf.validate.field).string.uuid = true];
  reserved 4; reserved "part_numbers";
  repeated UploadPart parts = 5 [(buf.validate.field).repeated = {min_items: 1, max_items: 1000}];
}
message SignPartsResponse { repeated SignedPart parts = 1; }
message CompletedPart { uint32 part_number = 1; string etag = 2; string checksum = 3; }
message CompleteUploadRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string storage_id = 2 [(buf.validate.field).string.uuid = true]; string upload_id = 3 [(buf.validate.field).string.uuid = true]; repeated CompletedPart parts = 4; }
service LetFSService {
  rpc GetWorkspaceStorage(WorkspaceStorageRequest) returns (WorkspaceStorage) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storage-quota" }; }
  rpc UpdateStorageQuota(UpdateStorageQuotaRequest) returns (WorkspaceStorage) { option (google.api.http) = { patch: "/v1/workspaces/{workspace_id}/storage-quota" body: "*" }; }
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages" }; }
  rpc GetStorage(StorageRequest) returns (Storage) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}" }; }
  rpc UpdateStorage(UpdateStorageRequest) returns (Storage) { option (google.api.http) = { patch: "/v1/workspaces/{workspace_id}/storages/{storage_id}" body: "*" }; }
  rpc ListStorageAccess(StorageRequest) returns (StorageAccess) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/access" }; }
  rpc SetStorageAccess(SetStorageAccessRequest) returns (AccessGrant) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}:setAccess" body: "*" }; }
  rpc RevokeStorageAccess(RevokeStorageAccessRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}:revokeAccess" body: "*" }; }
  rpc Stat(NodeRequest) returns (Node) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}" }; }
  rpc BatchStat(BatchStatRequest) returns (BatchStatResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:batchStat" body: "*" }; }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{parent.node_id}/children" }; }
  rpc ReadTree(ReadTreeRequest) returns (ReadTreeResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:readTree" body: "*" }; }
  rpc CreateNode(CreateNodeRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes" body: "*" }; }
  rpc CreateDirectories(CreateDirectoriesRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:createDirectories" body: "*" }; }
  rpc MoveNode(TransferNodeRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:move" body: "*" }; }
  rpc CopyNode(TransferNodeRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:copy" body: "*" }; }
  rpc ReadText(ReadTextRequest) returns (ReadTextResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}/text" }; }
  rpc MutateText(MutateTextRequest) returns (Node) { option (google.api.http) = { patch: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}/text" body: "*" }; }
  rpc ReadImage(ReadImageRequest) returns (google.api.HttpBody) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}/image" }; }
  rpc GetDownload(NodeRequest) returns (GetDownloadResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}:download" }; }
  rpc DownloadArchive(DownloadArchiveRequest) returns (stream google.api.HttpBody) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes:downloadArchive" body: "*" }; }
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/files:search" body: "*" }; }
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/files:textSearch" body: "*" }; }
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/files:semanticSearch" body: "*" }; }
  rpc TrashNode(TrashNodeRequest) returns (TrashEntry) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/nodes/{target.node_id}:trash" body: "*" }; }
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/trash" }; }
  rpc RestoreTrash(RestoreTrashRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/trash/{trash_id}:restore" body: "*" }; }
  rpc PurgeTrash(PurgeTrashRequest) returns (google.protobuf.Empty) { option (google.api.http) = { delete: "/v1/workspaces/{workspace_id}/storages/{storage_id}/trash/{trash_id}" }; }
  rpc CreateUpload(CreateUploadRequest) returns (Upload) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/uploads" body: "*" }; }
  rpc GetUpload(UploadRequest) returns (Upload) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/storages/{storage_id}/uploads/{upload_id}" }; }
  rpc SignParts(SignPartsRequest) returns (SignPartsResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/uploads/{upload_id}:signParts" body: "*" }; }
  rpc CompleteUpload(CompleteUploadRequest) returns (Node) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/storages/{storage_id}/uploads/{upload_id}:complete" body: "*" }; }
  rpc AbortUpload(UploadRequest) returns (google.protobuf.Empty) { option (google.api.http) = { delete: "/v1/workspaces/{workspace_id}/storages/{storage_id}/uploads/{upload_id}" }; }
}
