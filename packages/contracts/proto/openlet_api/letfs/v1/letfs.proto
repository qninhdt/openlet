syntax = "proto3";
package openlet_api.letfs.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/qninhdt/openlet/packages/go/gen/openlet_api/letfs/v1;letfsv1";

service FilesystemService {
  rpc GetFilesystem(GetFilesystemRequest) returns (GetFilesystemResponse);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc CreateDirectories(CreateDirectoriesRequest) returns (CreateDirectoriesResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option (google.api.http) = {
      get: "/v1/filesystems/{filesystem_id}/scopes/{scope_id}/nodes/{node_id}"
      response_body: "node"
    };
  }
  rpc ResolveNode(ResolveNodeRequest) returns (ResolveNodeResponse);
  rpc BatchStat(BatchStatRequest) returns (BatchStatResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc ReadText(ReadTextRequest) returns (ReadTextResponse);
  rpc TextMetrics(TextMetricsRequest) returns (TextMetricsResponse);
  rpc ReadTree(ReadTreeRequest) returns (ReadTreeResponse);
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse);
  rpc ReadImage(ReadImageRequest) returns (ReadImageResponse);
  rpc WriteText(WriteTextRequest) returns (WriteTextResponse);
  rpc AppendText(AppendTextRequest) returns (AppendTextResponse);
  rpc PatchText(PatchTextRequest) returns (PatchTextResponse);
  rpc TruncateText(TruncateTextRequest) returns (TruncateTextResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc ReplaceContent(ReplaceContentRequest) returns (ReplaceContentResponse);
  rpc CreateCopy(CreateCopyRequest) returns (CreateCopyResponse);
  rpc GetProcessing(GetProcessingRequest) returns (GetProcessingResponse);
  rpc ReprocessNode(ReprocessNodeRequest) returns (ReprocessNodeResponse);
  rpc TrashNode(TrashNodeRequest) returns (TrashNodeResponse);
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);
  rpc GetTrash(GetTrashRequest) returns (GetTrashResponse);
  rpc RestoreTrash(RestoreTrashRequest) returns (RestoreTrashResponse);
  rpc PurgeTrash(PurgeTrashRequest) returns (PurgeTrashResponse);
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  rpc GetUpload(GetUploadRequest) returns (GetUploadResponse);
  rpc GetUploadParts(GetUploadPartsRequest) returns (GetUploadPartsResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc AbortUpload(AbortUploadRequest) returns (AbortUploadResponse);
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
  rpc GetDownload(GetDownloadRequest) returns (GetDownloadResponse);
  // Metadata precedes bounded byte chunks; a non-OK terminal status invalidates a partial archive.
  rpc StreamArchive(StreamArchiveRequest) returns (stream StreamArchiveResponse);
}

// Generation authority is validated against letfs records, independently of service authentication.
service IngestService {
  rpc PrepareParse(PrepareParseRequest) returns (PrepareParseResponse);
  rpc PrepareParseOutput(PrepareParseOutputRequest) returns (PrepareParseOutputResponse);
  rpc CompleteParse(CompleteParseRequest) returns (CompleteParseResponse);
  rpc AbortParse(AbortParseRequest) returns (AbortParseResponse);
  rpc PrepareEnrichment(PrepareEnrichmentRequest) returns (PrepareEnrichmentResponse);
  rpc PrepareEnrichmentOutput(PrepareEnrichmentOutputRequest) returns (PrepareEnrichmentOutputResponse);
  rpc CompleteEnrichment(CompleteEnrichmentRequest) returns (CompleteEnrichmentResponse);
  rpc FailEnrichment(FailEnrichmentRequest) returns (FailEnrichmentResponse);
  rpc PrepareIndex(PrepareIndexRequest) returns (PrepareIndexResponse);
  rpc CompleteIndex(CompleteIndexRequest) returns (CompleteIndexResponse);
  rpc FailIndex(FailIndexRequest) returns (FailIndexResponse);
  rpc GetOutputUpload(GetOutputUploadRequest) returns (GetOutputUploadResponse);
  rpc GetOutputUploadParts(GetOutputUploadPartsRequest) returns (GetOutputUploadPartsResponse);
  rpc CompleteOutputUpload(CompleteOutputUploadRequest) returns (CompleteOutputUploadResponse);
  rpc WriteOutputBytes(WriteOutputBytesRequest) returns (WriteOutputBytesResponse);
}

// These methods require explicit service authority, never a public user JWT.
service StorageAdministrationService {
  rpc DeleteFilesystem(DeleteFilesystemRequest) returns (DeleteFilesystemResponse);
  rpc CreateFilesystem(CreateFilesystemRequest) returns (CreateFilesystemResponse);
  rpc CreateScopes(CreateScopesRequest) returns (CreateScopesResponse);
  // Read-only candidates for Workspace's authorized accessible-scope view.
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
}

message DeleteFilesystemRequest {
  string filesystem_id = 1;
}
message DeleteFilesystemResponse {
  bool completed = 1;
}

message Node {
  string id = 1;
  optional string parent_id = 3;
  string name = 4;
  string kind = 5;
  int64 revision = 6;
  int64 size_bytes = 7;
  optional string media_type = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional string title = 11;
  optional string description = 12;
  optional string semantic_type = 13;
  // Omitted from list/search metadata; only explicitly requested detail can include context.
  optional string context = 14;
  string scope_id = 15;
  bool readonly = 16;
}
message GetNodeRequest {
  string filesystem_id = 1;
  string node_id = 2;
  string scope_id = 3;
}
message GetNodeResponse {
  Node node = 1;
}
message GetDownloadRequest {
  string filesystem_id = 1;
  string node_id = 2;
  optional int64 revision = 3;
  string scope_id = 4;
}
message Download {
  string mime = 1;
  string filename = 2;
  string etag = 3;
  int64 size_bytes = 4;
  oneof source {
    bytes inline_content = 5;
    string signed_url = 6;
  }
}
message GetDownloadResponse {
  Download download = 1;
}
message StreamArchiveRequest {
  string filesystem_id = 1;
  string node_id = 2;
  string scope_id = 3;
}
message ArchiveMetadata {
  string filename = 1;
  string mime = 2;
}
message StreamArchiveResponse {
  oneof frame {
    ArchiveMetadata metadata = 1;
    // Each chunk is at most 64 KiB. No archive bytes or signed URLs enter Temporal histories.
    bytes data = 2;
  }
}
message PrepareParseRequest {
  string file_id = 1;
  int64 generation = 2;
}
message ParseInput {
  string source_id = 1;
  string format = 2;
  int64 size_bytes = 3;
  int64 inline_limit_bytes = 4;
  int64 multipart_threshold_bytes = 5;
  int64 max_outputs = 6;
  int64 max_output_bytes = 7;
  oneof source {
    bytes inline_content = 8;
    string signed_url = 9;
  }
}
message ParseComplete {
  string source_id = 1;
}
message PrepareParseResponse {
  oneof result {
    ParseInput input = 1;
    ParseComplete complete = 2;
  }
}
message CreateFilesystemRequest {
  string filesystem_id = 1;
  string idempotency_key = 2;
  int64 limit_bytes = 3;
}
message Filesystem {
  string id = 1;
  int64 limit_bytes = 2;
  int64 used_bytes = 3;
  int64 node_count = 4;
  string state = 5;
}
message CreateFilesystemResponse {
  Filesystem filesystem = 1;
}

message PathLocator {
  string path = 1;
  optional string cwd_id = 2;
}
message Locator {
  oneof target {
    string node_id = 1;
    PathLocator path = 2;
  }
  optional string expected_node_id = 3;
  optional string expected_parent_id = 4;
  // Traversal boundary inside the scope; omitted uses the ordinary scope root.
  optional string root_id = 5;
}
// These representations contain bounded text or blob metadata, never original blob bytes/URLs.
message FileStat {
  Node node = 1;
  string storage_kind = 2;
  string representation_kind = 3;
  int64 readable_size = 4;
  string fingerprint = 5;
  optional int64 newline_count = 6;
  optional string sha256 = 7;
}
message StatRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator locator = 3;
  bool content_check = 4;
}
message StatResponse {
  FileStat stat = 1;
}
message ByteRange {
  int64 offset = 1;
  optional int64 length = 2;
}
message LineRange {
  int64 start_line = 1;
  int64 line_count = 2;
}
message LineCount {
  int64 line_count = 1;
}
message WholeText {}
message ReadTextRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator locator = 3;
  oneof selection {
    WholeText whole = 4;
    ByteRange bytes = 5;
    LineRange lines = 6;
    LineCount head = 7;
    LineCount tail = 8;
  }
  optional string expected_fingerprint = 9;
}
message ReadTextResponse {
  FileStat stat = 1;
  bytes content = 2;
  int64 offset = 3;
  int64 length = 4;
}
message TextMetricsRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator locator = 3;
  string algorithm = 4;
}
message TextMetricsResponse {
  FileStat stat = 1;
  string algorithm = 2;
  string digest = 3;
  bool supported = 4;
}
message ReadTreeRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator root = 3;
  optional int32 depth = 4;
  optional string cursor = 5;
  optional int32 limit = 6;
  optional int32 max_bytes = 7;
}
message TreeEntry {
  string path = 1;
  FileStat stat = 2;
}
message ReadTreeResponse {
  repeated TreeEntry items = 1;
  optional string next_cursor = 2;
  bool complete = 3;
}
// Literal candidate selection. Command/regex matching belongs to the caller.
message TextSearchRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator locator = 3;
  string mode = 4; // files or lines
  string text = 5;
  bool ignore_case = 6;
  optional int32 max_files = 7;
  optional int32 max_lines = 8;
  optional int32 max_bytes = 9;
}
message TextSearchResponse {
  // Incomplete means no payload; the caller may fall back to ordinary permitted reads.
  bool complete = 1;
  repeated TreeEntry items = 2;
  bytes content = 3;
  FileStat stat = 4; // present only for a complete lines result
}
message ReadImageRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator locator = 3;
  optional string expected_fingerprint = 4;
}
message ReadImageResponse {
  FileStat stat = 1;
  bytes content = 2;
  string mime = 3;
  int32 width = 4;
  int32 height = 5;
  string sha256 = 6;
}
message GetFilesystemRequest {
  string filesystem_id = 1;
}
message GetFilesystemResponse {
  Filesystem filesystem = 1;
}
// Existing writes bind the observed identity and revision. Creation binds parent/name absence.
message ExistingText {
  Locator locator = 1;
  int64 revision = 2;
  optional string expected_fingerprint = 3;
}
message TextCreation {
  Locator parent = 1;
  string name = 2;
  string media_type = 3;
  string idempotency_key = 4;
  optional string node_id = 5;
}
message TextTarget {
  oneof target {
    ExistingText existing = 1;
    TextCreation create = 2;
  }
}
message WriteTextRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  TextTarget target = 3;
  bytes content = 4;
}
message AppendTextRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  TextTarget target = 3;
  bytes content = 4;
}
message ByteOverwrite {
  int64 offset = 1;
  bytes content = 2;
}
message LiteralReplacement {
  string old_text = 1;
  string new_text = 2;
  bool replace_all = 3;
}
message PatchTextRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  TextTarget target = 3;
  oneof patch {
    ByteOverwrite bytes = 4;
    LiteralReplacement literal = 5;
  }
}
message TruncateTextRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  TextTarget target = 3;
  int64 length = 4;
  bool no_create = 5;
}
message TextMutation {
  FileStat stat = 1;
  // Zero/empty for a creation; otherwise the exact observation before mutation.
  int64 before_revision = 2;
  string before_fingerprint = 3;
}
message WriteTextResponse {
  TextMutation result = 1;
}
message AppendTextResponse {
  TextMutation result = 1;
}
message PatchTextResponse {
  TextMutation result = 1;
}
message TruncateTextResponse {
  TextMutation result = 1;
}

message DirectoryCreation {
  Locator parent = 1;
  string name = 2;
}
message CreateDirectoriesRequest {
  string filesystem_id = 1;
  string scope_id = 2;
  Locator parent = 3;
  repeated string components = 4;
  bool parents = 5;
}
message CreateDirectoriesResponse {
  Node node = 1;
}
message InlineFileCreation {
  Locator parent = 1;
  string name = 2;
  bytes content = 3;
  string media_type = 4;
}
message CreateNodeRequest {
  string filesystem_id = 1;
  string idempotency_key = 2;
  oneof input {
    DirectoryCreation directory = 4;
    InlineFileCreation file = 5;
  }
  string scope_id = 6;
  optional string node_id = 7;
}
message CreateNodeResponse {
  Node node = 1;
}
message ListNodesRequest {
  string filesystem_id = 1;
  Locator parent = 2;
  optional int32 limit = 4;
  optional string cursor = 5;
  string scope_id = 6;
}
message ListNodesResponse {
  repeated Node items = 1;
  optional string next_cursor = 2;
}
message ResolveNodeRequest {
  string filesystem_id = 1;
  Locator locator = 2;
  string scope_id = 3;
}
message ResolveNodeResponse {
  Node node = 1;
}

// At most 100 locators; failure is atomic rather than returning foreign/missing metadata.
message BatchStatRequest {
  string filesystem_id = 1;
  repeated ScopedLocator locators = 2;
}
message ScopedLocator {
  string scope_id = 1;
  Locator locator = 2;
}
message BatchStatResponse {
  repeated Node items = 1;
}
message UpdateNodeRequest {
  optional string destination_scope_id = 8;
  string filesystem_id = 1;
  Locator locator = 2;
  optional int64 revision = 4;
  optional string name = 5;
  Locator parent = 6;
  string scope_id = 7;
}
message UpdateNodeResponse {
  Node node = 1;
}
message ReplaceContentRequest {
  string filesystem_id = 1;
  Locator locator = 2;
  optional int64 revision = 4;
  bytes content = 5;
  string media_type = 6;
  string scope_id = 7;
}
message ReplaceContentResponse {
  Node node = 1;
}
message CreateCopyRequest {
  optional string destination_scope_id = 8;
  optional string source_root_id = 9;
  optional string destination_root_id = 10;
  string filesystem_id = 1;
  string source_id = 2;
  string parent_id = 3;
  string name = 4;
  optional int64 revision = 5;
  string idempotency_key = 6;
  string scope_id = 7;
}
message CreateCopyResponse {
  Node node = 1;
}
message Processing {
  int64 desired_generation = 1;
  reserved 4;
  reserved "artifact_root_id";
  string publication_status = 5;
  optional string error_code = 7;
  string file_id = 8;
}
message GetProcessingRequest {
  string filesystem_id = 1;
  string node_id = 2;
  string scope_id = 3;
}
message GetProcessingResponse {
  Processing processing = 1;
}
message ReprocessNodeRequest {
  string filesystem_id = 1;
  string node_id = 2;
  string idempotency_key = 3;
  string scope_id = 4;
}
message ReprocessNodeResponse {
  string file_id = 1;
  int64 generation = 2;
  string workflow_id = 3;
}
message TrashEntry {
  string actor_kind = 8;
  string id = 1;
  string node_id = 2;
  optional string parent_id = 3;
  string name = 4;
  string actor_id = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}
message TrashNodeRequest {
  string filesystem_id = 1;
  Locator locator = 2;
  optional int64 revision = 4;
  string scope_id = 5;
  // Atomically require an ordinary empty directory before moving it to trash.
  bool empty_directory = 6;
}
message TrashNodeResponse {
  TrashEntry entry = 1;
}
message ListTrashRequest {
  string filesystem_id = 1;
  optional int32 limit = 2;
  optional string cursor = 3;
  string scope_id = 4;
}
message ListTrashResponse {
  repeated TrashEntry items = 1;
  optional string next_cursor = 2;
}
message GetTrashRequest {
  string filesystem_id = 1;
  string entry_id = 2;
  string scope_id = 3;
}
message GetTrashResponse {
  TrashEntry entry = 1;
}
message RestoreTrashRequest {
  string filesystem_id = 1;
  string entry_id = 2;
  string scope_id = 3;
  optional string destination_scope_id = 4;
  Locator parent = 5;
  optional string name = 6;
  optional string root_id = 7;
}
message RestoreTrashResponse {
  Node node = 1;
}
message PurgeTrashRequest {
  string filesystem_id = 1;
  string entry_id = 2;
  string scope_id = 3;
}
message PurgeTrashResponse {}

message UploadDestination {
  Locator parent = 1;
  string name = 2;
}
message UploadReplacement {
  Locator locator = 1;
  optional int64 revision = 2;
}
message SignedUpload {
  string url = 1;
  map<string, string> headers = 2;
  int64 content_length = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message UploadReceipt {
  string id = 1;
  string status = 2;
  int64 size_bytes = 3;
}
message UploadPublication {
  string node_id = 1;
  string status = 2;
  int64 revision = 3;
}
message Upload {
  string id = 1;
  string status = 2;
  string transport = 3;
  google.protobuf.Timestamp expires_at = 4;
  optional int64 size_bytes = 5;
  optional int64 part_size_bytes = 6;
  optional int32 part_count = 7;
  SignedUpload transfer = 8;
  oneof result {
    UploadPublication publication = 9;
    UploadReceipt receipt = 10;
  }
}
message CreateUploadRequest {
  string filesystem_id = 1;
  string idempotency_key = 2;
  optional int64 size_bytes = 4;
  string media_type = 5;
  optional string content_md5 = 6;
  // Public uploads are object-only; inline writes use CreateNode/ReplaceContent.
  oneof target {
    UploadDestination destination = 7;
    UploadReplacement replacement = 8;
  }
  string scope_id = 9;
}
message CreateUploadResponse {
  Upload upload = 1;
}
message GetUploadRequest {
  string filesystem_id = 1;
  string upload_id = 2;
  string scope_id = 3;
}
message GetUploadResponse {
  Upload upload = 1;
}

// At most 64 distinct part numbers, each within the admitted native multipart size.
message GetUploadPartsRequest {
  string filesystem_id = 1;
  string upload_id = 2;
  repeated int32 numbers = 3;
  string scope_id = 4;
}
message UploadPart {
  int32 part_number = 1;
  SignedUpload transfer = 2;
}
message GetUploadPartsResponse {
  repeated UploadPart items = 1;
}
message PartReceipt {
  int32 part_number = 1;
  string etag = 2;
}
message CompleteUploadRequest {
  string filesystem_id = 1;
  string upload_id = 2;
  repeated PartReceipt parts = 3;
  string scope_id = 4;
}
message CompleteUploadResponse {
  UploadPublication publication = 1;
}
message AbortUploadRequest {
  string filesystem_id = 1;
  string upload_id = 2;
  string scope_id = 3;
}
message AbortUploadResponse {}

message SearchFilters {
  Locator parent = 1;
  optional string semantic_type = 2;
  optional string media_type = 3;
  google.protobuf.Timestamp created_after = 4;
  google.protobuf.Timestamp created_before = 5;
  google.protobuf.Timestamp updated_after = 6;
  google.protobuf.Timestamp updated_before = 7;
}
message SearchFilesRequest {
  string filesystem_id = 1;
  string query = 2;
  SearchFilters filters = 3;
  optional int32 limit = 4;
  optional string cursor = 5;
  optional string sort = 6;
  optional string direction = 7;
  string scope_id = 8;
}
message Breadcrumb {
  string node_id = 1;
  string filename = 2;
}
message SearchMatch {
  string file_id = 1;
  repeated Breadcrumb breadcrumb = 2;
  string snippet = 3;
}
message SearchResult {
  Node node = 1;
  string path = 2;
  SearchMatch matched = 3;
}
message SearchFilesResponse {
  repeated SearchResult items = 1;
  optional string next_cursor = 2;
  bool degraded = 3;
  optional string degraded_reason = 4;
}
message SemanticSearchRequest {
  string filesystem_id = 1;
  string query = 2;
  SearchFilters filters = 3;
  optional int32 limit = 4;
  string scope_id = 6;
}
message SemanticSearchResponse {
  repeated SearchResult items = 1;
  bool degraded = 3;
  optional string degraded_reason = 4;
}

// Scope is checked against stored generation facts after service authentication.
message ProcessingGeneration {
  string file_id = 1;
  int64 generation = 2;
}
message OutputDescription {
  string path = 1;
  string storage = 2;
  optional int64 size_bytes = 3;
  optional string content_md5 = 4;
}
message PrepareParseOutputRequest {
  ProcessingGeneration source = 1;
  OutputDescription output = 2;
}
message PrepareParseOutputResponse {
  Upload upload = 1;
}
message CompleteParseRequest {
  ProcessingGeneration source = 1;
  repeated string uploads = 2;
  repeated string directories = 3;
}
message CompleteParseResponse {
  string source_id = 1;
}
message AbortParseRequest {
  ProcessingGeneration source = 1;
  string error_code = 2;
}
message AbortParseResponse {}
message InventoryNode {
  string id = 1;
  optional string parent_id = 2;
  string path = 3;
  string name = 4;
  string kind = 5;
  int64 size_bytes = 6;
  optional string media_type = 7;
  optional string title = 8;
  optional string description = 9;
  optional string context = 10;
  oneof content {
    bytes inline_content = 11;
    string signed_url = 12;
  }
}
message PrepareEnrichmentRequest {
  ProcessingGeneration source = 1;
}
message EnrichmentInput {
  string source_id = 1;
  repeated InventoryNode nodes = 2;
  int64 inline_limit_bytes = 3;
  int64 multipart_threshold_bytes = 4;
  int64 max_output_bytes = 5;
}
message EnrichmentComplete {
  string source_id = 1;
}
message PrepareEnrichmentResponse {
  oneof result {
    EnrichmentInput input = 1;
    EnrichmentComplete complete = 2;
  }
}
message PrepareEnrichmentOutputRequest {
  ProcessingGeneration source = 1;
  OutputDescription output = 2;
}
message PrepareEnrichmentOutputResponse {
  Upload upload = 1;
}
message SemanticMetadata {
  string title = 1;
  string description = 2;
  string semantic_type = 3;
  string context = 4;
}
message EnrichmentUpdate {
  string id = 1;
  string path = 2;
  SemanticMetadata metadata = 3;
  optional string upload_id = 4;
}
message CompleteEnrichmentRequest {
  ProcessingGeneration source = 1;
  repeated EnrichmentUpdate nodes = 2;
}
message CompleteEnrichmentResponse {
  string source_id = 1;
}
message FailEnrichmentRequest {
  ProcessingGeneration source = 1;
  string error_code = 2;
}
message FailEnrichmentResponse {}
message VectorSpace {
  string model = 1;
  string collection = 2;
  int32 dimension = 3;
}
message PrepareIndexRequest {
  ProcessingGeneration source = 1;
}
message IndexInput {
  string filesystem_id = 1;
  string source_id = 2;
  int64 generation = 3;
  repeated InventoryNode nodes = 4;
  VectorSpace vector_space = 5;
  int64 max_output_bytes = 6;
  string scope_id = 7;
}
message IndexComplete {
  string source_id = 1;
}
message PrepareIndexResponse {
  oneof result {
    IndexInput input = 1;
    IndexComplete complete = 2;
  }
}
message CompleteIndexRequest {
  ProcessingGeneration source = 1;
}
message CompleteIndexResponse {
  string source_id = 1;
}
message FailIndexRequest {
  ProcessingGeneration source = 1;
  string error_code = 3;
}
message FailIndexResponse {}
message OutputUploadScope {
  ProcessingGeneration source = 1;
  // Only parse or enrichment; index has no writable output surface.
  string stage = 2;
  string upload_id = 3;
}
message GetOutputUploadRequest {
  OutputUploadScope scope = 1;
}
message GetOutputUploadResponse {
  Upload upload = 1;
}
message GetOutputUploadPartsRequest {
  OutputUploadScope scope = 1;
  repeated int32 numbers = 2;
}
message GetOutputUploadPartsResponse {
  repeated UploadPart items = 1;
}
message CompleteOutputUploadRequest {
  OutputUploadScope scope = 1;
  repeated PartReceipt parts = 2;
}
message CompleteOutputUploadResponse {
  UploadReceipt receipt = 1;
}
message WriteOutputBytesRequest {
  OutputUploadScope scope = 1;
  bytes content = 2;
}
message WriteOutputBytesResponse {
  // Bytes are received but publication is separate; completion saves the immutable receipt.
  UploadReceipt receipt = 1;
}

message Scope {
  string id = 1;
  string filesystem_id = 2;
  string root_id = 3;
  string state = 4;
  bool allow_blob_files = 5;
  bool allow_indexing = 6;
}
message CreateScopesRequest {
  string filesystem_id = 1;
  repeated string scope_ids = 2;
  string idempotency_key = 3;
  optional bool allow_blob_files = 4;
  optional bool allow_indexing = 5;
}
message CreateScopesResponse {
  repeated Scope scopes = 1;
}
message ListScopesRequest {
  string filesystem_id = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
}
message ListScopesResponse {
  repeated Scope scopes = 1;
  optional string next_cursor = 2;
}
