syntax = "proto3";
package openlet.platform.v1;
option go_package = "github.com/qninhdt/openlet/packages/sdk-go/gen/openlet_api/platform/v1;platformv1";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

enum WorkspaceRole { WORKSPACE_ROLE_UNSPECIFIED = 0; WORKSPACE_ROLE_OWNER = 1; WORKSPACE_ROLE_MEMBER = 2; }
enum WorkspaceState { WORKSPACE_STATE_UNSPECIFIED = 0; WORKSPACE_STATE_PROVISIONING = 1; WORKSPACE_STATE_ACTIVE = 2; WORKSPACE_STATE_DELETING = 3; }
message AvatarAppearance {
  string shape = 1 [(buf.validate.field).string.in = "cercle", (buf.validate.field).string.in = "galet", (buf.validate.field).string.in = "squircle", (buf.validate.field).string.in = "capsule", (buf.validate.field).string.in = "triangle", (buf.validate.field).string.in = "hexagone", (buf.validate.field).string.in = "nuage", (buf.validate.field).string.in = "goutte"];
  string color = 2 [(buf.validate.field).string.in = "rouge", (buf.validate.field).string.in = "orange", (buf.validate.field).string.in = "ambre", (buf.validate.field).string.in = "vert", (buf.validate.field).string.in = "turquoise", (buf.validate.field).string.in = "bleu", (buf.validate.field).string.in = "violet", (buf.validate.field).string.in = "rose", (buf.validate.field).string.in = "encre", (buf.validate.field).string.in = "creme", (buf.validate.field).string.in = "brun", (buf.validate.field).string.in = "gris"];
}
message AccountPreferences {
  optional string theme = 1 [(buf.validate.field).string.in = "system", (buf.validate.field).string.in = "light", (buf.validate.field).string.in = "dark"];
  optional string send_shortcut = 2 [(buf.validate.field).string.in = "enter", (buf.validate.field).string.in = "modifier-enter"];
  optional bool show_agent_steps = 3;
  optional bool compact_message_actions = 4;
  optional bool message_sound = 5;
}
// Preferences are included only in the authenticated user's own account response.
message User { string id = 1; string display_name = 2; optional string avatar_url = 3; AvatarAppearance appearance = 4; AccountPreferences preferences = 5; }
message Workspace { string id = 1; string name = 2; WorkspaceState state = 3; google.protobuf.Timestamp created_at = 4; optional WorkspaceRole role = 5; }
message WorkspaceMember { User user = 1; WorkspaceRole role = 2; optional string workspace_id = 3; }
message Invitation { string id = 1; string workspace_id = 2; string email = 3; google.protobuf.Timestamp expires_at = 4; optional string accepted_by_user_id = 5; }
message UpdateMeRequest { optional string display_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}]; optional string avatar_url = 2 [(buf.validate.field).string.max_len = 2048]; AvatarAppearance appearance = 3; AccountPreferences preferences = 4; }
message ListWorkspacesRequest { int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 2; }
message ListWorkspacesResponse { repeated Workspace workspaces = 1; string next_page_token = 2; }
message CreateMyWorkspaceRequest { string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}]; string request_id = 2 [(buf.validate.field).string.uuid = true]; }
message WorkspaceRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; }
message UpdateWorkspaceRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; optional string name = 2 [(buf.validate.field).string.min_len = 1]; }
message TransferWorkspaceOwnershipRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string new_owner_user_id = 2 [(buf.validate.field).string.uuid = true]; }
message ListMembersRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 3; }
message ListMembersResponse { repeated WorkspaceMember members = 1; string next_page_token = 2; }
message AddMemberRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string user_id = 2 [(buf.validate.field).string.uuid = true]; string request_id = 3 [(buf.validate.field).string.uuid = true]; }
message RemoveMemberRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string user_id = 2 [(buf.validate.field).string.uuid = true]; }
message CreateInvitationRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string email = 2 [(buf.validate.field).string.email = true]; string request_id = 3 [(buf.validate.field).string.uuid = true]; }
message CreateInvitationResponse { Invitation invitation = 1; optional string token = 2; }
message ListInvitationsRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; string page_token = 3; }
message ListInvitationsResponse { repeated Invitation invitations = 1; string next_page_token = 2; }
message RevokeInvitationRequest { string workspace_id = 1 [(buf.validate.field).string.uuid = true]; string invitation_id = 2 [(buf.validate.field).string.uuid = true]; }
message AcceptInvitationRequest { string token = 1 [(buf.validate.field).string.min_len = 1]; }
service PlatformService {
  rpc Onboard(google.protobuf.Empty) returns (User) { option (google.api.http) = { post: "/v1/me:onboard" body: "*" }; }
  rpc GetMe(google.protobuf.Empty) returns (User) { option (google.api.http) = { get: "/v1/me" }; }
  rpc UpdateMe(UpdateMeRequest) returns (User) { option (google.api.http) = { patch: "/v1/me" body: "*" }; }
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) { option (google.api.http) = { get: "/v1/workspaces" }; }
  rpc CreateMyWorkspace(CreateMyWorkspaceRequest) returns (Workspace) { option (google.api.http) = { post: "/v1/workspaces" body: "*" }; }
  rpc GetWorkspace(WorkspaceRequest) returns (Workspace) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}" }; }
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace) { option (google.api.http) = { patch: "/v1/workspaces/{workspace_id}" body: "*" }; }
  rpc DeleteWorkspace(WorkspaceRequest) returns (Workspace) { option (google.api.http) = { delete: "/v1/workspaces/{workspace_id}" }; }
  rpc TransferWorkspaceOwnership(TransferWorkspaceOwnershipRequest) returns (WorkspaceMember) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}:transferOwnership" body: "*" }; }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/members" }; }
  rpc AddMember(AddMemberRequest) returns (WorkspaceMember) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/members" body: "*" }; }
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty) { option (google.api.http) = { delete: "/v1/workspaces/{workspace_id}/members/{user_id}" }; }
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) { option (google.api.http) = { post: "/v1/workspaces/{workspace_id}/invitations" body: "*" }; }
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) { option (google.api.http) = { get: "/v1/workspaces/{workspace_id}/invitations" }; }
  rpc RevokeInvitation(RevokeInvitationRequest) returns (google.protobuf.Empty) { option (google.api.http) = { delete: "/v1/workspaces/{workspace_id}/invitations/{invitation_id}" }; }
  rpc AcceptInvitation(AcceptInvitationRequest) returns (WorkspaceMember) { option (google.api.http) = { post: "/v1/invitations:accept" body: "*" }; }
}
