syntax = "proto3";
package openlet_api.workspace.v1;

import "openlet_api/account/v1/account.proto";

option go_package = "github.com/qninhdt/openlet/packages/go/gen/openlet_api/workspace/v1;workspacev1";

service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc ListAccessibleScopes(ListAccessibleScopesRequest) returns (ListAccessibleScopesResponse);
  rpc EnsureLetaHomeAccess(EnsureLetaHomeAccessRequest) returns (EnsureLetaHomeAccessResponse);
  rpc ResolvePersonalScope(ResolvePersonalScopeRequest) returns (ResolvePersonalScopeResponse);
  rpc ChangeScopeAccess(ChangeScopeAccessRequest) returns (ChangeScopeAccessResponse);
  rpc CleanupLetaAccess(CleanupLetaAccessRequest) returns (CleanupLetaAccessResponse);
}

message Workspace {
  string id = 1;
  string name = 2;
  string filesystem_id = 3;
  string shared_scope_id = 4;
  string status = 5;
  optional string role = 6;
  optional string personal_scope_id = 7;
}
message GetWorkspaceRequest {
  string workspace_id = 1;
  // Actor-free cleanup only; cannot request the normal member view.
  optional string cleanup_leta_id = 2;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}
message ListMembersRequest {
  string workspace_id = 1;
  optional string cursor = 2;
  int32 limit = 3;
}
message Member {
  openlet_api.account.v1.UserSummary user = 1;
  string role = 2;
  string personal_scope_id = 3;
}
message ListMembersResponse {
  string workspace_id = 1;
  repeated Member items = 2;
  optional string next_cursor = 3;
}
message ListAccessibleScopesRequest {
  string workspace_id = 1;
  optional string leta_id = 2;
  optional string cursor = 3;
  int32 limit = 4;
}
message ScopeRights {
  bool read_metadata = 1;
  bool read_content = 2;
  bool write = 3;
}
message AccessibleScope {
  string id = 1;
  string root_id = 2;
  string kind = 3;
  optional openlet_api.account.v1.UserSummary owner = 4;
  ScopeRights rights = 5;
}
message ListAccessibleScopesResponse {
  string workspace_id = 1;
  string filesystem_id = 2;
  string subject_kind = 3;
  string subject_id = 4;
  repeated AccessibleScope items = 5;
  optional string next_cursor = 6;
}
message EnsureLetaHomeAccessRequest {
  string workspace_id = 1;
  string leta_id = 2;
  string home_scope_id = 3;
  string idempotency_key = 4;
}
message EnsureLetaHomeAccessResponse {
  string workspace_id = 1;
  string filesystem_id = 2;
  string home_scope_id = 3;
}
message ResolvePersonalScopeRequest {
  string workspace_id = 1;
  string owner_user_id = 2;
}
message ResolvePersonalScopeResponse {
  string workspace_id = 1;
  string filesystem_id = 2;
  string scope_id = 3;
  string owner_user_id = 4;
}
message ChangeScopeAccessRequest {
  string workspace_id = 1;
  string scope_id = 2;
  string grantee_kind = 3;
  string grantee_id = 4;
  string role = 5;
  bool revoke = 6;
  string idempotency_key = 7;
  // Set for a personal access approval; must equal the delegated human actor.
  optional string personal_owner_user_id = 8;
}
message ChangeScopeAccessResponse {
  string workspace_id = 1;
  string scope_id = 2;
  string grantee_kind = 3;
  string grantee_id = 4;
  ScopeRights rights = 5;
}
message CleanupLetaAccessRequest {
  string workspace_id = 1;
  string leta_id = 2;
  string home_scope_id = 3;
}
message CleanupLetaAccessResponse {
  bool completed = 1;
}
