    "/internal/v1/filesystems/{fs}/files/{action}": {
      "post": {
        "operationId": "filePrimitive",
        "security": [
          {
            "serviceToken": []
          }
        ],
        "parameters": [
          {
            "name": "fs",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "action",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "batch-stat",
                "search",
                "semantic-search"
              ]
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "scope": {
                        "type": "object",
                        "properties": {
                          "actor_id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "mounts": {
                            "type": "array",
                            "minItems": 1,
                            "maxItems": 32,
                            "items": {
                              "type": "object",
                              "properties": {
                                "path": {
                                  "type": "string"
                                },
                                "filesystem_id": {
                                  "type": "string",
                                  "format": "uuid"
                                }
                              },
                              "required": [
                                "path",
                                "filesystem_id"
                              ],
                              "additionalProperties": false
                            }
                          }
                        },
                        "required": [
                          "actor_id",
                          "mounts"
                        ],
                        "additionalProperties": false
                      },
                      "input": {
                        "type": "object",
                        "properties": {
                          "locators": {
                            "type": "array",
                            "minItems": 1,
                            "maxItems": 100,
                            "items": {
                              "$ref": "#/components/schemas/Locator"
                            }
                          }
                        },
                        "required": [
                          "locators"
                        ],
                        "additionalProperties": false
                      }
                    },
                    "required": [
                      "scope",
                      "input"
                    ],
                    "additionalProperties": false
                  },
                  {
                    "$ref": "#/components/schemas/SearchRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Scoped result"
          },
          "default": {
            "description": "Error",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Scoped batch metadata and search reads. Mutations use resource routes."
      }
    },
