  "components": {
    "securitySchemes": {
      "serviceToken": {
        "type": "http",
        "scheme": "bearer"
      },
      "processorToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Separate activity-worker credential. Only processing routes accept it; every request also verifies operation/generation/invocation ownership."
      }
    },
    "schemas": {
      "Bucket": {
        "type": "object",
        "required": [
          "id",
          "limit_bytes",
          "used_bytes",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "limit_bytes": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "used_bytes": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "state": {
            "type": "string",
            "enum": [
              "active",
              "frozen",
              "deleted"
            ]
          },
          "upload_limits": {
            "$ref": "#/components/schemas/UploadLimits"
          }
        }
      },
      "Filesystem": {
        "type": "object",
        "required": [
          "id",
          "bucket_id",
          "root_id",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "bucket_id": {
            "type": "string",
            "format": "uuid"
          },
          "root_id": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "state": {
            "type": "string",
            "enum": [
              "active",
              "deleting",
              "deleted"
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "code",
          "request_id"
        ],
        "additionalProperties": false
      },
      "Profile": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "display_name": {
            "type": "string"
          },
          "avatar_url": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "display_name",
          "avatar_url"
        ],
        "additionalProperties": false
      },
      "Locator": {
        "type": "object",
        "properties": {
          "node_id": {
            "type": "string",
            "format": "uuid"
          },
          "path": {
            "type": "string",
            "maxLength": 4096
          },
          "cwd_id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_node_id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_parent_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [],
        "additionalProperties": false,
        "oneOf": [
          {
            "required": [
              "node_id"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "path"
                  ]
                },
                {
                  "required": [
                    "cwd_id"
                  ]
                }
              ]
            }
          },
          {
            "required": [
              "path"
            ],
            "not": {
              "required": [
                "node_id"
              ]
            }
          }
        ],
        "description": "Filesystem-scoped ID or mounted path, optionally relative to cwd_id. The first filesystem-relative @<canonical UUID> segment at the root aliases a live node. Files support child traversal/listing; strict descendants of files are read-only. Directory-style trailing syntax is invalid for content reads."
      },
      "Upload": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "size_bytes": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "transport": {
            "enum": [
              "inline",
              "single",
              "multipart"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "transfer": {
            "$ref": "#/components/schemas/UploadTransfer"
          },
          "part_size_bytes": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "part_count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "result": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/UploadResult"
              },
              {
                "$ref": "#/components/schemas/ProcessorUploadResult"
              }
            ]
          },
          "status": {
            "enum": [
              "open",
              "completing",
              "finalized",
              "aborted"
            ]
          }
        },
        "required": [
          "id",
          "status"
        ],
        "additionalProperties": false
      },
      "UploadResult": {
        "type": "object",
        "properties": {
          "node_id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "status": {
            "const": "finalized"
          }
        },
        "required": [
          "node_id",
          "status"
        ],
        "additionalProperties": false
      },
      "UploadTransfer": {
        "type": "object",
        "properties": {
          "url": {
            "type": "string",
            "format": "uri"
          },
          "headers": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "content_length": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "url",
          "headers",
          "content_length",
          "expires_at"
        ],
        "additionalProperties": false
      },
      "UploadReceipt": {
        "type": "object",
        "properties": {
          "part_number": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "etag": {
            "type": "string"
          }
        },
        "required": [
          "part_number",
          "etag"
        ],
        "additionalProperties": false
      },
      "UploadPartURLs": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {
              "type": "object",
              "properties": {
                "part_number": {
                  "type": "integer"
                },
                "transfer": {
                  "$ref": "#/components/schemas/UploadTransfer"
                }
              },
              "required": [
                "part_number",
                "transfer"
              ],
              "additionalProperties": false
            }
          }
        },
        "required": [
          "items"
        ],
        "additionalProperties": false
      },
      "UploadLimits": {
        "type": "object",
        "properties": {
          "inline_limit_bytes": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
