[project]
name = "openlet-python"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "authzed==1.25.0",
    "googleapis-common-protos==1.76.0",
    "grpcio==1.85.1",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "protobuf==7.36.2",
    "temporalio[opentelemetry]==1.35.0",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.85.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlet_api", "src/openlet"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: builds isolated wheels and uses actual gRPC transports"]
