[project]
name = "openlet-python"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "googleapis-common-protos==1.76.0",
    "grpcio==1.85.1",
    "protobuf==7.36.2",
]

[dependency-groups]
dev = ["grpcio-tools==1.85.1", "pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlet_api"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = ["integration: builds isolated wheels and uses actual gRPC transports"]
