[project]
name = "openlet-sdk"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "grpcio", "protobuf", "googleapis-common-protos", "pyyaml", "temporalio",
  "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-instrumentation-grpc", "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-system-metrics",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlet_sdk", "src/openlet_api", "src/buf"]
