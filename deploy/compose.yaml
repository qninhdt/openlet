name: openlet

x-app-env: &app-env
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: openlet
  GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
  USER_SERVICE_TOKEN_FILE: /run/secrets/user_service_token
  WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token

services:
  postgres:
    restart: unless-stopped
    command: [postgres, -c, max_connections=200, -c, log_lock_waits=on]
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: openlet_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, user_db_password, workspace_db_password, letfs_db_password, temporal_db_password, temporal_visibility_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-openlet.sh:ro
      - ${OPENLET_STATE_DIR:-../.local}/backups:/backups
      - ../services:/migrations:ro
      - ../scripts/migrate.sh:/migrate.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U openlet_admin -d postgres]
      interval: 2s
      timeout: 3s
      retries: 40
    networks: [backend]

  temporal-backup:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: [sh, /backup.sh]
    secrets: [temporal_db_password, temporal_visibility_db_password]
    volumes:
      - ../scripts/backup-temporal-schema.sh:/backup.sh:ro
      - ${OPENLET_STATE_DIR:-../.local}/backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]

  temporal-schema:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint: [sh, /schema.sh]
    secrets: [temporal_db_password, temporal_visibility_db_password]
    volumes: [./temporal/schema.sh:/schema.sh:ro]
    depends_on:
      temporal-backup: {condition: service_completed_successfully}
    networks: [backend]

  temporal:
    restart: unless-stopped
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    entrypoint: [temporal-server, --config-file, /config/openlet.yaml, --allow-no-auth, start]
    volumes: ["${OPENLET_STATE_DIR:-../.local}/temporal.yaml:/config/openlet.yaml:ro"]
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    networks: [backend]

  temporal-init:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint: [sh, /namespace.sh]
    volumes: [./temporal/namespace.sh:/namespace.sh:ro]
    depends_on: [temporal]
    networks: [backend]

  user:
    restart: unless-stopped
    build: {context: .., dockerfile: deploy/go.Dockerfile, args: {SERVICE: user}}
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/user_database_url
      WORKSPACE_URL: http://workspace:8080
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      CLERK_API_URL: ${CLERK_API_URL:-https://api.clerk.com/v1}
    secrets: [user_database_url, gateway_token, user_service_token, workspace_service_token, clerk_secret_key]
    depends_on:
      temporal-init: {condition: service_completed_successfully}
    networks: [backend, outbound]
    stop_grace_period: 155s
    healthcheck:
      test: [CMD, /server, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20

  workspace:
    restart: unless-stopped
    build: {context: .., dockerfile: deploy/go.Dockerfile, args: {SERVICE: workspace}}
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/workspace_database_url
      USER_URL: http://user:8080
      LETFS_URL: http://letfs:8080
      MAX_OWNED_WORKSPACES: ${MAX_OWNED_WORKSPACES:-100}
      MAX_MEMBERS: ${MAX_MEMBERS:-100}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
      INVITE_TTL: ${INVITE_TTL:-168h}
    secrets: [workspace_database_url, gateway_token, user_service_token, workspace_service_token]
    depends_on:
      temporal-init: {condition: service_completed_successfully}
    networks: [backend]
    stop_grace_period: 155s
    healthcheck:
      test: [CMD, /server, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20

  letfs:
    restart: unless-stopped
    build: {context: .., dockerfile: deploy/letfs.Dockerfile}
    environment:
      DATABASE_URL_FILE: /run/secrets/letfs_database_url
      WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
      TEMPORAL_ADDRESS: http://temporal:7233
      PROCESSOR_SERVICE_TOKEN_FILE: /run/secrets/processor_service_token
      PROCESSING_MAX_OUTPUTS: ${PROCESSING_MAX_OUTPUTS:-512}
      PROCESSING_MAX_OUTPUT_BYTES: ${PROCESSING_MAX_OUTPUT_BYTES:-268435456}
      TEMPORAL_NAMESPACE: openlet
      MAX_NODES: ${MAX_NODES:-1000000}
      INLINE_LIMIT_BYTES: ${INLINE_LIMIT_BYTES:-262144}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_OUTSTANDING_STORAGE: ${MAX_OUTSTANDING_STORAGE:-16}
      MAX_CLEANUP_BACKLOG: ${MAX_CLEANUP_BACKLOG:-10000}
      MAX_COPY_NODES: ${MAX_COPY_NODES:-10000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_SIGNING_ENDPOINT: ${S3_SIGNING_ENDPOINT:-${S3_ENDPOINT:-}}
      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_TRANSFER_GRACE_SECONDS: ${UPLOAD_TRANSFER_GRACE_SECONDS:-3600}
      MULTIPART_THRESHOLD_BYTES: ${MULTIPART_THRESHOLD_BYTES:-16777216}
      MULTIPART_PART_BYTES: ${MULTIPART_PART_BYTES:-8388608}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-300}
      EXPORT_MAX_ROOTS: ${EXPORT_MAX_ROOTS:-32}
      EXPORT_MAX_ENTRIES: ${EXPORT_MAX_ENTRIES:-10000}
      EXPORT_MAX_SOURCE_BYTES: ${EXPORT_MAX_SOURCE_BYTES:-1073741824}
      EXPORT_MAX_OUTPUT_BYTES: ${EXPORT_MAX_OUTPUT_BYTES:-1107296256}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
      EXPORT_RUNTIME_SECONDS: ${EXPORT_RUNTIME_SECONDS:-1200}
      EXPORT_RETENTION_SECONDS: ${EXPORT_RETENTION_SECONDS:-86400}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-openlet}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets: [letfs_database_url, workspace_service_token, processor_service_token, s3_access_key_id, s3_secret_access_key]
    depends_on:
      temporal-init: {condition: service_completed_successfully}
    networks: [backend, outbound]
    stop_grace_period: 135s
    healthcheck:
      test: [CMD, letfs, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20

  processor:
    restart: unless-stopped
    image: ${PROCESSOR_IMAGE:-openlet-processor:local}
    build: {context: .., dockerfile: services/letfs/processor/Dockerfile}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      LETFS_URL: http://letfs:8080
      PROCESSOR_SERVICE_TOKEN_FILE: /run/secrets/processor_service_token
    secrets: [processor_service_token]
    depends_on:
      letfs: {condition: service_healthy}
    networks: [backend, outbound]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1g,mode=1777"]
    stop_grace_period: 40s

  envoy:
    restart: unless-stopped
    image: envoyproxy/envoy:v1.37.0@sha256:d9b4a70739d92b3e28cd407f106b0e90d55df453d7d87773efd22b4429777fe8
    command: [-c, /etc/envoy/openlet.json, --log-level, warn]
    volumes: ["${OPENLET_STATE_DIR:-../.local}/envoy.json:/etc/envoy/openlet.json:ro"]
    ports: [127.0.0.1:8080:8080]
    depends_on: [user, workspace]
    networks: [backend, outbound]

networks:
  backend: {internal: true}
  outbound: {}
volumes:
  postgres-data: {}
secrets:
  s3_access_key_id: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/s3_access_key_id"}
  s3_secret_access_key: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/s3_secret_access_key"}
  clerk_secret_key: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/clerk_secret_key"}
  postgres_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/postgres_password"}
  user_db_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/user_db_password"}
  workspace_db_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/workspace_db_password"}
  letfs_db_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/letfs_db_password"}
  temporal_db_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/temporal_db_password"}
  temporal_visibility_db_password: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/temporal_visibility_db_password"}
  user_database_url: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/user_database_url"}
  workspace_database_url: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/workspace_database_url"}
  letfs_database_url: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/letfs_database_url"}
  gateway_token: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/gateway_token"}
  user_service_token: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/user_service_token"}
  workspace_service_token: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/workspace_service_token"}
  processor_service_token: {file: "${OPENLET_STATE_DIR:-../.local}/secrets/processor_service_token"}
