# Complete test environment configuration; secrets come from the test runner environment.
runtime:
  environment: test
  log_level: info
  shutdown_timeout_seconds: 180
grpc:
  max_receive_bytes: 16777216
telemetry:
  otlp_endpoint: null
  trace_sample_ratio: 0.1
  metrics_export_interval_seconds: 60
langfuse:
  base_url: http://wiremock:8080
  public_key: ${LANGFUSE_PUBLIC_KEY}
  secret_key: ${LANGFUSE_SECRET_KEY}
  prompt_label: production
auth:
  clerk:
    issuer: http://wiremock:8080
    jwks_url: http://wiremock:8080/.well-known/jwks.json
    audience: openlet
    api_url: http://wiremock:8080/v1
    secret_key: ${CLERK_SECRET_KEY}
dependencies:
  postgres:
    host: postgres
    port: 5432
    sslmode: disable
  temporal:
    address: temporal:7233
    namespace: openlet
    tls: false
    queues:
      platform: openlet-platform
      letfs: openlet-letfs
      ingest_cpu: openlet-ingest-cpu
      ingest_io: openlet-ingest-io
      leta: openlet-leta
      leta_runtime: openlet-leta-runtime
      leta_bridge: openlet-leta-bridge
  redis:
    address: redis:6379
    database: 0
    password: ${REDIS_PASSWORD}
  spicedb:
    address: spicedb:50051
    tls: false
    key: ${SPICEDB_KEY}
  s3:
    endpoint: http://s3:9000
    region: us-east-1
    bucket: openlet
    path_style: true
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
  qdrant:
    address: qdrant:6334
    tls: false
    api_key: ${QDRANT_API_KEY}
    collection: files
models:
  gateway:
    base_url: http://litellm:4000
    api_key: ${LITELLM_MASTER_KEY}
    timeout_seconds: 90
  embedding:
    model: openai/text-embedding-3-small
    dimensions: 1536
  reranking:
    model: cohere/rerank-v3.5
  enrichment:
    output_mode: tools
    max_input_characters: 24000
    max_image_pixels: 25000000
    image_max_side: 1600
    image_jpeg_quality: 85
services:
  gateway:
    http_listen: 0.0.0.0:8080
    public_url: http://envoy:8080
  platform:
    grpc_listen: 0.0.0.0:9090
    grpc_target: platform:9090
    database:
      name: platform
      user: platform
      password: ${PLATFORM_DB_PASSWORD}
    max_members: 2
    default_quota_bytes: 10737418240
    invitation_ttl_seconds: 604800
    idempotency_retention_seconds: 86400
    maintenance:
      interval_seconds: 300
  letfs:
    grpc_listen: 0.0.0.0:9090
    grpc_target: letfs:9090
    database:
      name: letfs
      user: letfs
      password: ${LETFS_DB_PASSWORD}
    max_text_bytes: 262144
    max_blob_bytes: 104857600
    multipart_threshold_bytes: 16777216
    multipart_part_bytes: 8388608
    upload_url_ttl_seconds: 900
    download_url_ttl_seconds: 300
    idempotency_retention_seconds: 86400
    processing:
      max_artifacts: 512
      max_manifest_text_bytes: 8388608
      max_artifact_blob_bytes: 268435456
      parse_timeout_seconds: 600
      enrich_index_timeout_seconds: 900
    maintenance:
      interval_seconds: 300
      object_gc_grace_seconds: 86400
  leta:
    http_listen: 0.0.0.0:8080
    compaction:
      trigger_fraction: 0.8
      keep_tokens: 8192
      summary_max_tokens: 2048
    http_target: leta-api:8080
    database:
      name: leta
      user: leta
      password: ${LETA_DB_PASSWORD}
  letfs_ingest:
    cpu:
      activity_concurrency: 1
      docling_models_path: /models/docling
      split_tokens: 4096
      threads: 2
      limits:
        max_pages: 200
        max_page_pixels: 25000000
        max_office_expanded_bytes: 536870912
        max_spreadsheet_cells: 1000000
        max_sheets: 100
        max_output_bytes: 268435456
    io:
      activity_concurrency: 4
      model_concurrency: 4
      embedding_batch_size: 64
      chunk_size_tokens: 800
      chunk_overlap_tokens: 100
deployment:
  postgres:
    admin_user: openlet_admin
    admin_password: ${POSTGRES_ADMIN_PASSWORD}
  temporal:
    database:
      name: temporal
      user: temporal
      password: ${TEMPORAL_DB_PASSWORD}
    visibility_database: temporal_visibility
    namespace_retention_hours: 168
  spicedb:
    database:
      name: spicedb
      user: spicedb
      password: ${SPICEDB_DB_PASSWORD}
