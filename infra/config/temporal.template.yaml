log: {stdout: true, level: info}
persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: @DATABASE@
        connectAddr: @POSTGRES@
        connectProtocol: tcp
        user: @USER@
        password: @PASSWORD@
        maxConns: 10
        maxIdleConns: 10
        tls: {enabled: false}
    visibility:
      sql:
        pluginName: postgres12
        databaseName: @VISIBILITY_DATABASE@
        connectAddr: @POSTGRES@
        connectProtocol: tcp
        user: @USER@
        password: @PASSWORD@
        maxConns: 5
        maxIdleConns: 5
        tls: {enabled: false}
global:
  metrics:
    prometheus:
      listenAddress: 0.0.0.0:9090
      timerType: histogram
  membership: {maxJoinDuration: 30s, broadcastAddress: 127.0.0.1}
  pprof: {port: 7936}
services:
  frontend:
    rpc: {grpcPort: 7233, membershipPort: 6933, bindOnIP: 0.0.0.0}
  history:
    rpc: {grpcPort: 7234, membershipPort: 6934, bindOnIP: 0.0.0.0}
  matching:
    rpc: {grpcPort: 7235, membershipPort: 6935, bindOnIP: 0.0.0.0}
  worker:
    rpc: {membershipPort: 6939, bindOnIP: 0.0.0.0}
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active: {enabled: true, initialFailoverVersion: 1, rpcName: temporal-frontend, rpcAddress: '127.0.0.1:7233'}
dcRedirectionPolicy: {policy: noop}
archival:
  history: {state: disabled, enableRead: false}
  visibility: {state: disabled, enableRead: false}
namespaceDefaults:
  archival:
    history: {state: disabled}
    visibility: {state: disabled}
