# Public names describe models; deployments choose the upstream supplier.
# Add real supplier rates to litellm_params when known; never use demo prices.
credential_list:
  - credential_name: vilao
    credential_info: {}
    credential_values:
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY

model_list:
  - model_name: openai/gpt-6.2-sol
    litellm_params:
      model: gpt-6.2-sol
      custom_llm_provider: custom_openai
      litellm_credential_name: vilao
      allowed_openai_params: [reasoning_effort]
    model_info:
      max_input_tokens: 131072
      base_model: gpt-6.2-sol
      access_groups: [leta]
      supported_reasoning_efforts: [low, medium, high]
      supports_response_schema: false
  - model_name: openai/gpt-6.1-sol
    litellm_params:
      # Vilao's Chat Completions stream works; avoid OpenAI's automatic Responses bridge.
      model: gpt-6.1-sol
      custom_llm_provider: custom_openai
      litellm_credential_name: vilao
      allowed_openai_params: [reasoning_effort]
    model_info:
      max_input_tokens: 131072
      base_model: gpt-6.1-sol
      access_groups: [leta]
      supported_reasoning_efforts: [low, medium, high]
      supports_response_schema: false
  - model_name: deepseek/deepseek-v4.1-flash
    litellm_params:
      model: deepseek-v4.1-flash
      custom_llm_provider: custom_openai
      litellm_credential_name: vilao
      allowed_openai_params: [reasoning_effort]
    model_info:
      # Conservative deployment working bounds; not a provider capacity claim.
      max_input_tokens: 131072
      max_output_tokens: 8192
      supported_reasoning_efforts: [low, medium, high]
      access_groups: [leta]
      supports_response_schema: false
  - model_name: openai/text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      litellm_credential_name: vilao
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  telemetry: false
  include_cost_in_streaming_usage: true
  callbacks: [prometheus]
router_settings:
  num_retries: 1
