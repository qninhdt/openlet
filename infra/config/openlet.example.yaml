# Shared configuration for Platform, LetFS, Chat, Leta and native infrastructure.
# Copy to .local/openlet.yaml and set OPENLET_CONFIG to that file.
# Example endpoints must be replaced. Secrets live in .env/process environment.
# A ${VARIABLE_NAME} scalar references that secret; it is resolved after YAML parsing.
runtime:
  environment: development
  log_level: info
  shutdown_timeout_seconds: 180

grpc:
  max_receive_bytes: 16777216

telemetry:
  otlp_endpoint: http://alloy:4317
  trace_sample_ratio: 1.0
  metrics_export_interval_seconds: 60

# Enable the native Compose profile: COMPOSE_PROFILES=observability.
# Use the endpoint and instance IDs shown in Grafana Cloud's connection pages.
observability:
  metrics:
    endpoint: https://prometheus.example.invalid/api/prom/push
    user: 'replace-with-metrics-instance-id'
  traces:
    endpoint: https://otlp-gateway.example.invalid/otlp
    user: 'replace-with-traces-instance-id'
  logs:
    endpoint: https://logs.example.invalid/loki/api/v1/push
    user: 'replace-with-logs-instance-id'
  token: ${GRAFANA_CLOUD_TOKEN}
  postgres_user: openlet_metrics
  postgres_password: ${OBSERVABILITY_DB_PASSWORD}

langfuse:
  base_url: https://cloud.langfuse.com
  public_key: ${LANGFUSE_PUBLIC_KEY}
  secret_key: ${LANGFUSE_SECRET_KEY}
  prompt_label: production

auth:
  clerk:
    issuer: https://clerk.example.invalid
    jwks_url: https://clerk.example.invalid/.well-known/jwks.json
    audience: openlet
    # Use a distinct metadata key for each deployment sharing a Clerk tenant.
    user_id_metadata_key: openlet_user_id
    api_url: https://api.clerk.com/v1
    secret_key: ${CLERK_SECRET_KEY}

dependencies:
  postgres:
    host: postgres
    port: 5432
    sslmode: disable
  temporal:
    address: temporal:7233
    namespace: openlet
    tls: false
    queues:
      platform: openlet-platform
      letfs: openlet-letfs
      ingest_cpu: openlet-ingest-cpu
      ingest_io: openlet-ingest-io
      leta_orchestration: openlet-leta-orchestration
      leta_runtime: openlet-leta-runtime
  spicedb:
    address: spicedb:50051
    tls: false
    key: ${SPICEDB_KEY}
  s3:
    endpoint: http://s3:9000
    # processing_download_endpoint: https://s3.example.com
    region: us-east-1
    bucket: openlet
    path_style: true
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
  qdrant:
    address: qdrant:6334
    tls: false
    api_key: ${QDRANT_API_KEY}
    collection: files
  redis:
    address: redis:6379
    database: 0
    password: ${REDIS_PASSWORD}
  centrifugo:
    api_url: http://centrifugo:8000/api
    api_key: ${CENTRIFUGO_API_KEY}
    token_hmac_secret: ${CENTRIFUGO_TOKEN_SECRET}
    token_ttl_seconds: 3600

models:
  gateway:
    base_url: http://litellm:4000
    api_key: ${LITELLM_MASTER_KEY}
    timeout_seconds: 90
  embedding:
    model: openai/text-embedding-3-large
    dimensions: 1536
  reranking: null
  enrichment:
    output_mode: tools
    max_input_characters: 24000
    max_image_pixels: 25000000
    image_max_side: 1600
    image_jpeg_quality: 85

services:
  gateway:
    http_listen: 0.0.0.0:8080
    public_url: http://localhost:8080
  platform:
    grpc_listen: 0.0.0.0:9090
    grpc_target: platform:9090
    database:
      name: platform
      user: platform
      password: ${PLATFORM_DB_PASSWORD}
    max_members: 100
    default_quota_bytes: 10737418240
    invitation_ttl_seconds: 604800
    idempotency_retention_seconds: 86400
    maintenance:
      interval_seconds: 300
  chat:
    grpc_listen: 0.0.0.0:9090
    grpc_target: chat:9090
    database:
      name: chat
      user: chat
      password: ${CHAT_DB_PASSWORD}
    outbox:
      batch_size: 64
      poll_interval_seconds: 2
      max_backoff_seconds: 60
      retention_hours: 24
  letfs:
    grpc_listen: 0.0.0.0:9090
    grpc_target: letfs:9090
    database:
      name: letfs
      user: letfs
      password: ${LETFS_DB_PASSWORD}
    max_text_bytes: 1048576
    max_blob_bytes: 104857600
    multipart_threshold_bytes: 16777216
    multipart_part_bytes: 8388608
    upload_url_ttl_seconds: 900
    download_url_ttl_seconds: 300
    idempotency_retention_seconds: 86400
    search:
      default_limit: 100
      max_limit: 100
      timeout_seconds: 30
      max_line_chars: 2000
    semantic_search:
      candidate_limit: 50
      result_limit: 10
      max_result_limit: 25
      timeout_seconds: 30
      max_excerpt_chars: 2000
    processing:
      max_artifacts: 512
      max_manifest_text_bytes: 8388608
      max_artifact_blob_bytes: 268435456
      parse_timeout_seconds: 1200
      enrich_index_timeout_seconds: 900
    maintenance:
      interval_seconds: 300
      object_gc_grace_seconds: 86400
  leta:
    http_listen: 0.0.0.0:8000
    http_target: leta-api:8000
    grpc_listen: 0.0.0.0:9091
    grpc_target: leta-api:9091
    database:
      name: leta
      user: leta
      password: ${LETA_DB_PASSWORD}
    # web_search:
    #   api_key: ${TINYFISH_API_KEY}
    tools:
      hitl: true
      subagents: true
      schedule: true
      web: true
      bash: true
      semantic_search: true
      todo: false
      react: true
    model:
      output_token_fallback: 32000
      output_token_max: 256000
      output_token_min: 1024
      estimate_error_margin: 0.15
      window_headroom: 0.01
      max_length_continuations: 2
      max_steps_per_run: null
      chars_per_token: 4
      image_token_estimate: 1500
      pdf_token_estimate: 2000
      retry:
        max_attempts: 10
        initial_interval_seconds: 2
        max_interval_seconds: 10
        retry_after_max_seconds: 900
        timeout_max_retries: 3
        unreachable_gap_max_seconds: 30
        unreachable_window_seconds: 3600
        one_shot_retries: 3
    compaction:
      auto: true
      reserve_share: 0.15
      reserve_min_tokens: 16000
      unknown_window_tokens: 200000
      summary_output_floor: 32000
      keep_recent_tokens: 15000
      recent_tool_output_max_chars: 1250
      transcript_clip_chars: 2000
      shrink_steps: [0.85, 0.7, 0.5, 0.35]
      snapshot_max_subagents: 20
      snapshot_max_idle_subagents: 10
      background:
        enabled: true
        precompute_lead_tokens: 60000
        tail_share: 0.4
        cache_lifetime_seconds: 300
        cache_margin_seconds: 30
        max_failures: 2
    tool_output:
      max_lines: 2000
      max_bytes: 51200
      max_line_length: 2000
      spill_dir: /home/.tool-output
      retention_days: 7
      input_repair_max_depth: 6
      input_excerpt_limit: 2048
    file_tools:
      read_tail_lines: 100
      edit_miss_hint_lines: 12
      edit_miss_hint_line_length: 200
      search_default_limit: 100
      search_timeout_seconds: 30
    bash:
      default_timeout_seconds: 120
      max_timeout_seconds: 600
      python_max_memory: 256MB
      network: public_only
      shared_mount_read_policy: fresh
    media:
      max_ingest_bytes: 20971520
      image_auto_resize: true
      image_max_width: 2000
      image_max_height: 2000
      image_max_base64_bytes: 5242880
      png_passthrough_max_base64_bytes: 393216
      small_png_max_pixels: 65536
      jpeg_qualities: [80, 70, 55, 40]
      history_image_bytes_trigger: 26214400
      history_image_bytes_target: 15728640
    web:
      fetch_mode: direct_with_fallback
      fetch_default_timeout_seconds: 30
      fetch_max_timeout_seconds: 120
      fetch_max_redirects: 10
      fetch_max_response_bytes: 5242880
      search_max_results: 5
    subagents:
      max_depth: 3
      max_active_per_leta: 16
    messaging:
      max_attachments: 20
      max_sources: 64
      active_channel_ttl_seconds: 300
      notification_preview_chars: 120
    orchestration:
      run_timeout_seconds: 7200
      heartbeat_interval_seconds: 3
      heartbeat_timeout_seconds: 60
      lease_ttl_seconds: 60
      lease_renew_interval_seconds: 10
      max_concurrent_orchestration_activities: 64
      max_concurrent_runtime_activities: 32
  letfs_ingest:
    cpu:
      activity_concurrency: 8
      office_concurrency: 2
      split_tokens: 4096
      # Free plan defaults. With Team, start with concurrency 8 and 120 requests/minute.
      datalab:
        concurrency: 2
        result_concurrency: 2
        requests_per_minute: 10
        max_response_bytes: 100663296
      limits:
        max_pages: 50
        max_page_pixels: 25000000
        max_office_expanded_bytes: 536870912
        max_spreadsheet_cells: 1000000
        max_sheets: 100
        max_output_bytes: 268435456
    io:
      activity_concurrency: 12
      model_concurrency: 16
      embedding_batch_size: 256
      chunk_size_tokens: 512
      chunk_overlap_tokens: 64

# Only deployment/bootstrap tools resolve these secrets; applications do not.
deployment:
  postgres:
    admin_user: openlet_admin
    admin_password: ${POSTGRES_ADMIN_PASSWORD}
  temporal:
    database:
      name: temporal
      user: temporal
      password: ${TEMPORAL_DB_PASSWORD}
    visibility_database: temporal_visibility
    namespace_retention_hours: 168
  spicedb:
    database:
      name: spicedb
      user: spicedb
      password: ${SPICEDB_DB_PASSWORD}
