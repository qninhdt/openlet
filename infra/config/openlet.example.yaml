# Shared configuration for Platform, LetFS and native infrastructure.
# Copy to .local/openlet.yaml and set OPENLET_CONFIG to that file.
# Example endpoints must be replaced. Secrets live in .env/process environment.
# A ${VARIABLE_NAME} scalar references that secret; it is resolved after YAML parsing.
runtime:
  environment: development
  log_level: info
  shutdown_timeout_seconds: 180

grpc:
  max_receive_bytes: 16777216

telemetry:
  otlp_endpoint: http://alloy:4317
  trace_sample_ratio: 1.0
  metrics_export_interval_seconds: 60

# Enable the native Compose profile: COMPOSE_PROFILES=observability.
# Use the endpoint and instance IDs shown in Grafana Cloud's connection pages.
observability:
  metrics:
    endpoint: https://prometheus.example.invalid/api/prom/push
    user: 'replace-with-metrics-instance-id'
  traces:
    endpoint: https://otlp-gateway.example.invalid/otlp
    user: 'replace-with-traces-instance-id'
  logs:
    endpoint: https://logs.example.invalid/loki/api/v1/push
    user: 'replace-with-logs-instance-id'
  token: ${GRAFANA_CLOUD_TOKEN}
  postgres_user: openlet_metrics
  postgres_password: ${OBSERVABILITY_DB_PASSWORD}

langfuse:
  base_url: https://cloud.langfuse.com
  public_key: ${LANGFUSE_PUBLIC_KEY}
  secret_key: ${LANGFUSE_SECRET_KEY}
  prompt_label: production

auth:
  clerk:
    issuer: https://clerk.example.invalid
    jwks_url: https://clerk.example.invalid/.well-known/jwks.json
    audience: openlet
    # Use a distinct metadata key for each deployment sharing a Clerk tenant.
    user_id_metadata_key: openlet_user_id
    api_url: https://api.clerk.com/v1
    secret_key: ${CLERK_SECRET_KEY}

dependencies:
  postgres:
    host: postgres
    port: 5432
    sslmode: disable
  temporal:
    address: temporal:7233
    namespace: openlet
    tls: false
    queues:
      platform: openlet-platform
      letfs: openlet-letfs
      ingest_cpu: openlet-ingest-cpu
      ingest_io: openlet-ingest-io
      leta: openlet-leta
      leta_runtime: openlet-leta-runtime
      leta_bridge: openlet-leta-bridge
  spicedb:
    address: spicedb:50051
    tls: false
    key: ${SPICEDB_KEY}
  s3:
    endpoint: http://s3:9000
    # processing_download_endpoint: https://s3.example.com
    region: us-east-1
    bucket: openlet
    path_style: true
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
  qdrant:
    address: qdrant:6334
    tls: false
    api_key: ${QDRANT_API_KEY}
    collection: files
  redis:
    address: redis:6379
    database: 0
    password: ${REDIS_PASSWORD}

models:
  gateway:
    base_url: http://litellm:4000
    api_key: ${LITELLM_MASTER_KEY}
    timeout_seconds: 90
  embedding:
    model: openai/text-embedding-3-large
    dimensions: 1536
  reranking: null
  enrichment:
    output_mode: tools
    max_input_characters: 24000
    max_image_pixels: 25000000
    image_max_side: 1600
    image_jpeg_quality: 85
services:
  gateway:
    http_listen: 0.0.0.0:8080
    public_url: http://localhost:8080
  platform:
    grpc_listen: 0.0.0.0:9090
    grpc_target: platform:9090
    database:
      name: platform
      user: platform
      password: ${PLATFORM_DB_PASSWORD}
    max_members: 100
    default_quota_bytes: 10737418240
    invitation_ttl_seconds: 604800
    idempotency_retention_seconds: 86400
    maintenance:
      interval_seconds: 300
  letfs:
    grpc_listen: 0.0.0.0:9090
    grpc_target: letfs:9090
    database:
      name: letfs
      user: letfs
      password: ${LETFS_DB_PASSWORD}
    max_text_bytes: 1048576
    max_blob_bytes: 104857600
    multipart_threshold_bytes: 16777216
    multipart_part_bytes: 8388608
    upload_url_ttl_seconds: 900
    download_url_ttl_seconds: 300
    idempotency_retention_seconds: 86400
    processing:
      max_artifacts: 512
      max_manifest_text_bytes: 8388608
      max_artifact_blob_bytes: 268435456
      parse_timeout_seconds: 1200
      enrich_index_timeout_seconds: 900
    maintenance:
      interval_seconds: 300
      object_gc_grace_seconds: 86400
  leta:
    # Optional integration. Core services do not load this section or wait for Leta.
    http_listen: 0.0.0.0:8000
    # web_search:
    #   api_key: ${TINYFISH_API_KEY}
    compaction:
      trigger_fraction: 0.8
      keep_tokens: 8192
      summary_max_tokens: 2048
    http_target: leta-api:8000
    database:
      name: leta
      user: leta
      password: ${LETA_DB_PASSWORD}
  letfs_ingest:
    cpu:
      activity_concurrency: 8
      office_concurrency: 2
      split_tokens: 4096
      # Free plan defaults. With Team, start with concurrency 8 and 120 requests/minute.
      datalab:
        concurrency: 2
        result_concurrency: 2
        requests_per_minute: 10
        max_response_bytes: 100663296
      limits:
        max_pages: 50
        max_page_pixels: 25000000
        max_office_expanded_bytes: 536870912
        max_spreadsheet_cells: 1000000
        max_sheets: 100
        max_output_bytes: 268435456
    io:
      activity_concurrency: 12
      model_concurrency: 16
      embedding_batch_size: 64
      chunk_size_tokens: 800
      chunk_overlap_tokens: 100

# Only deployment/bootstrap tools resolve these secrets; applications do not.
deployment:
  postgres:
    admin_user: openlet_admin
    admin_password: ${POSTGRES_ADMIN_PASSWORD}
  temporal:
    database:
      name: temporal
      user: temporal
      password: ${TEMPORAL_DB_PASSWORD}
    visibility_database: temporal_visibility
    namespace_retention_hours: 168
  spicedb:
    database:
      name: spicedb
      user: spicedb
      password: ${SPICEDB_DB_PASSWORD}
