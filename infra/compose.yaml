x-tools: &tools
  image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim@sha256:e80c05a310400cfc90af00b5b7271ef9ad24816e3265e1162af8a678e1aad099
  working_dir: /work
  volumes:
    - ../scripts:/work/scripts:ro
    - ../pyproject.toml:/work/pyproject.toml:ro
    - ../uv.lock:/work/uv.lock:ro
    - ../apps/letfs-ingest/pyproject.toml:/work/apps/letfs-ingest/pyproject.toml:ro
    - ../apps/leta/pyproject.toml:/work/apps/leta/pyproject.toml:ro
    - ../packages/env/pyproject.toml:/work/packages/env/pyproject.toml:ro
    - ../packages/sdk-python:/work/packages/sdk-python:ro
    - ../packages/contracts/authz:/work/packages/contracts/authz:ro
    - ${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro
    - tools-venv:/work/.venv
    - uv-cache:/root/.cache/uv
  environment:
    OPENLET_CONFIG: /etc/openlet/openlet.yaml
    UV_PYTHON_DOWNLOADS: never
    UV_LINK_MODE: copy
  depends_on:
    postgres: {condition: service_healthy}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  litellm:
    logging: *logging
    image: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
    command: [--config, /etc/litellm/config.yaml, --port, '4000', --num_workers, '1']
    volumes: [./config/litellm.yaml:/etc/litellm/config.yaml:ro]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 20

  redis:
    logging: *logging
    profiles: [leta]
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    entrypoint: [/bin/sh, -ec]
    command: ['exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no --save ""']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 3s
      timeout: 3s
      retries: 30

  leta-migrate:
    logging: *logging
    profiles: [leta]
    image: openlet/leta:local
    build: {context: .., dockerfile: apps/leta/Dockerfile}
    entrypoint: [/bin/sh, -ec]
    command: ['goose up && /app/.venv/bin/python -m leta.db']
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    depends_on:
      databases: {condition: service_completed_successfully}

  leta-api:
    logging: *logging
    profiles: [leta]
    image: openlet/leta:local
    build: {context: .., dockerfile: apps/leta/Dockerfile}
    command: [-m, leta.api]
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/ready",timeout=3)']
      interval: 3s
      timeout: 5s
      retries: 30
    depends_on:
      litellm: {condition: service_healthy}
      leta-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      resources: {condition: service_completed_successfully}

  leta-worker:
    logging: *logging
    profiles: [leta]
    image: openlet/leta:local
    build: {context: .., dockerfile: apps/leta/Dockerfile}
    command: [-m, leta.worker]
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    depends_on:
      litellm: {condition: service_healthy}
      leta-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      resources: {condition: service_completed_successfully}

  alloy:
    logging: *logging
    profiles: [observability]
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: [run, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345, /etc/alloy/alloy.alloy]
    mem_limit: 256m
    volumes:
      - ${OPENLET_GENERATED}/alloy.alloy:/etc/alloy/alloy.alloy:ro
      - alloy-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?required}
    stop_grace_period: 30s

  postgres:
    logging: *logging
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    command: [-c, max_connections=500]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  databases:
    logging: *logging
    <<: *tools
    command: [uv, run, --no-env-file, --locked, --no-dev, --package, openlet-tooling, python, scripts/bootstrap.py, databases]

  platform-migrate:
    logging: *logging
    image: openlet/platform:local
    build: {context: .., dockerfile: apps/platform/Dockerfile}
    entrypoint: [/usr/local/bin/goose]
    command: [up]
    depends_on:
      databases: {condition: service_completed_successfully}

  letfs-migrate:
    logging: *logging
    image: openlet/letfs:local
    build: {context: .., dockerfile: apps/letfs/Dockerfile}
    entrypoint: [/usr/local/bin/goose]
    command: [up]
    depends_on:
      databases: {condition: service_completed_successfully}

  spicedb-migrate:
    logging: *logging
    image: authzed/spicedb:v1.57.1@sha256:9ea6df2d3cca23ed63aa7205639cf6babaaf1dc9a264ffb1f50c6455658fd6ba
    command: [datastore, migrate, head, --datastore-engine, postgres]
    depends_on:
      databases: {condition: service_completed_successfully}

  spicedb:
    logging: *logging
    image: authzed/spicedb:v1.57.1@sha256:9ea6df2d3cca23ed63aa7205639cf6babaaf1dc9a264ffb1f50c6455658fd6ba
    command: [serve, --datastore-engine, postgres, --http-enabled=false, --skip-release-check]
    healthcheck:
      test: [CMD, grpc_health_probe, '-addr=127.0.0.1:50051']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      spicedb-migrate: {condition: service_completed_successfully}

  temporal-migrate:
    logging: *logging
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        temporal-sql-tool --db "$$TEMPORAL_DATABASE" setup-schema -v 0.0
        temporal-sql-tool --db "$$TEMPORAL_DATABASE" update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --db "$$TEMPORAL_VISIBILITY_DATABASE" setup-schema -v 0.0
        temporal-sql-tool --db "$$TEMPORAL_VISIBILITY_DATABASE" update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
    depends_on:
      databases: {condition: service_completed_successfully}

  temporal:
    logging: *logging
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    entrypoint: [temporal-server]
    command: [--config-file, /etc/openlet/temporal.yaml, --allow-no-auth, start]
    volumes: ['${OPENLET_GENERATED:?required}/temporal.yaml:/etc/openlet/temporal.yaml:ro']
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, '7233']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      temporal-migrate: {condition: service_completed_successfully}

  qdrant:
    logging: *logging
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/6334']
      interval: 3s
      timeout: 3s
      retries: 30

  resources:
    logging: *logging
    <<: *tools
    command: [uv, run, --no-env-file, --locked, --no-dev, --package, openlet-tooling, python, scripts/bootstrap.py, resources]
    depends_on:
      spicedb: {condition: service_healthy}
      temporal: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      platform-migrate: {condition: service_completed_successfully}
      letfs-migrate: {condition: service_completed_successfully}

  platform:
    logging: *logging
    image: openlet/platform:local
    build: {context: .., dockerfile: apps/platform/Dockerfile}
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    healthcheck:
      test: [CMD, grpc-health-probe, '-addr=127.0.0.1:9090']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      resources: {condition: service_completed_successfully}

  letfs:
    logging: *logging
    image: openlet/letfs:local
    build: {context: .., dockerfile: apps/letfs/Dockerfile}
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    healthcheck:
      test: [CMD, grpc-health-probe, '-addr=127.0.0.1:9090']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      litellm: {condition: service_healthy}
      resources: {condition: service_completed_successfully}

  ingest-cpu:
    logging: *logging
    image: openlet/letfs-ingest:local
    build: {context: .., dockerfile: apps/letfs-ingest/Dockerfile}
    command: [cpu]
    init: true
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    depends_on:
      letfs: {condition: service_healthy}

  ingest-io:
    logging: *logging
    image: openlet/letfs-ingest:local
    build: {context: .., dockerfile: apps/letfs-ingest/Dockerfile}
    command: [io]
    volumes: ['${OPENLET_CONFIG:?required}:/etc/openlet/openlet.yaml:ro']
    stop_grace_period: 190s
    depends_on:
      litellm: {condition: service_healthy}
      letfs: {condition: service_healthy}

  envoy:
    logging: *logging
    image: envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    command: [-c, /etc/openlet/envoy.yaml, --log-level, warn]
    volumes:
      - ${OPENLET_GENERATED:?required}/envoy.yaml:/etc/openlet/envoy.yaml:ro
      - ../packages/contracts/generated/public.pb:/etc/openlet/public.pb:ro
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      platform: {condition: service_healthy}
      letfs: {condition: service_healthy}

volumes:
  alloy-data:
  postgres-data:
  qdrant-data:
  tools-venv:
  uv-cache:
