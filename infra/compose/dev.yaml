name: openlet
x-app-env:
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: openlet
  GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
  WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
services:
  postgres:
    restart: unless-stopped
    command:
    - postgres
    - -c
    - max_connections=200
    - -c
    - log_lock_waits=on
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: openlet_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
    - postgres_password
    volumes:
    - postgres-data:/var/lib/postgresql
    - ${OPENLET_STATE_DIR:-../../.local}/init.sql:/docker-entrypoint-initdb.d/10-applications.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U openlet_admin -d postgres
      interval: 2s
      timeout: 3s
      retries: 40
    networks:
    - backend
  temporal-schema:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint:
    - /bin/sh
    - -ec
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
    - temporal_db_password
    environment:
      SQL_HOST: postgres
      SQL_PORT: '5432'
      SQL_PLUGIN: postgres12_pgx
      SQL_USER: openlet_temporal
      SQL_DATABASE: openlet_temporal
    command:
    - export SQL_PASSWORD="$$(cat /run/secrets/temporal_db_password)"; temporal-sql-tool
      setup-schema -v 0.0; temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
  temporal:
    restart: unless-stopped
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    entrypoint:
    - temporal-server
    - --config-file
    - /config/openlet.json
    - --allow-no-auth
    - start
    volumes:
    - ${OPENLET_STATE_DIR:-../../.local}/temporal.json:/config/openlet.json:ro
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
      visibility-schema:
        condition: service_completed_successfully
    networks:
    - backend
  temporal-init:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint:
    - /bin/sh
    - -ec
    depends_on:
    - temporal
    networks:
    - backend
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    command:
    - for attempt in $$(seq 1 60); do temporal operator cluster health >/dev/null
      2>&1 && break; sleep 1; done; temporal operator namespace describe --namespace
      openlet >/dev/null 2>&1 || temporal operator namespace create --namespace openlet
      --retention 168h
  workspace:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/workspace/Dockerfile
    environment:
      <<: *telemetry-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
      DATABASE_URL_FILE: /run/secrets/workspace_database_url
      ACCOUNT_URL: http://account:8080
      LETFS_URL: http://letfs:8080
      MAX_OWNED_WORKSPACES: ${MAX_OWNED_WORKSPACES:-100}
      MAX_MEMBERS: ${MAX_MEMBERS:-100}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
      INVITE_TTL: ${INVITE_TTL:-168h}
    secrets:
    - workspace_database_url
    - gateway_token
    - workspace_service_token
    depends_on:
      temporal-init:
        condition: service_completed_successfully
      workspace-migrate:
        condition: service_completed_successfully
    networks:
    - backend
    stop_grace_period: 155s
    healthcheck:
      test:
      - CMD
      - /server
      - --healthcheck
      interval: 5s
      timeout: 5s
      retries: 20
  letfs:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/letfs/Dockerfile
    environment:
      <<: *telemetry-env
      DATABASE_URL_FILE: /run/secrets/letfs_database_url
      WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
      TEMPORAL_ADDRESS: http://temporal:7233
      PROCESSOR_SERVICE_TOKEN_FILE: /run/secrets/processor_service_token
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_RERANK_MODEL: ${OPENROUTER_RERANK_MODEL:-cohere/rerank-v3.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-files}
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      PROCESSING_MAX_OUTPUTS: ${PROCESSING_MAX_OUTPUTS:-512}
      PROCESSING_MAX_OUTPUT_BYTES: ${PROCESSING_MAX_OUTPUT_BYTES:-268435456}
      TEMPORAL_NAMESPACE: openlet
      MAX_NODES: ${MAX_NODES:-1000000}
      INLINE_LIMIT_BYTES: ${INLINE_LIMIT_BYTES:-262144}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_OUTSTANDING_STORAGE: ${MAX_OUTSTANDING_STORAGE:-16}
      MAX_CLEANUP_BACKLOG: ${MAX_CLEANUP_BACKLOG:-10000}
      MAX_COPY_NODES: ${MAX_COPY_NODES:-10000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_SIGNING_ENDPOINT: ${S3_SIGNING_ENDPOINT:-${S3_ENDPOINT:-}}
      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_TRANSFER_GRACE_SECONDS: ${UPLOAD_TRANSFER_GRACE_SECONDS:-3600}
      MULTIPART_THRESHOLD_BYTES: ${MULTIPART_THRESHOLD_BYTES:-16777216}
      MULTIPART_PART_BYTES: ${MULTIPART_PART_BYTES:-8388608}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-300}
      ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:-10000}
      ARCHIVE_MAX_SOURCE_BYTES: ${ARCHIVE_MAX_SOURCE_BYTES:-1073741824}
      ARCHIVE_MAX_OUTPUT_BYTES: ${ARCHIVE_MAX_OUTPUT_BYTES:-1107296256}
      ARCHIVE_MAX_CONCURRENT: ${ARCHIVE_MAX_CONCURRENT:-2}
      ARCHIVE_RUNTIME_SECONDS: ${ARCHIVE_RUNTIME_SECONDS:-1200}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-openlet}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets:
    - letfs_database_url
    - workspace_service_token
    - processor_service_token
    - openrouter_api_key
    - qdrant_api_key
    - s3_access_key_id
    - s3_secret_access_key
    depends_on:
      temporal-init:
        condition: service_completed_successfully
      letfs-migrate:
        condition: service_completed_successfully
    networks:
    - backend
    - outbound
    stop_grace_period: 135s
    healthcheck:
      test:
      - CMD
      - letfs
      - --healthcheck
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    command:
    - export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_api_key)"; exec
      ./entrypoint.sh
    secrets:
    - qdrant_api_key
    volumes:
    - qdrant-data:/qdrant/storage
    networks:
    - backend
    stop_grace_period: 30s
  processor-cpu: &processor
    command: [cpu]
    restart: unless-stopped
    image: ${PROCESSOR_IMAGE:-openlet-processor:local}
    build:
      context: ../..
      dockerfile: apps/letfs-processing/Dockerfile
    environment:
      <<: *telemetry-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      LETFS_URL: http://letfs:8080
      PROCESSOR_SERVICE_TOKEN_FILE: /run/secrets/processor_service_token
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_RERANK_MODEL: ${OPENROUTER_RERANK_MODEL:-cohere/rerank-v3.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-files}
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      OPENROUTER_GENERATION_MODEL: ${OPENROUTER_GENERATION_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      AI_EVIDENCE_TOKENS: ${AI_EVIDENCE_TOKENS:-4096}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      CHUNK_TOKENS: ${CHUNK_TOKENS:-1024}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-128}
      MIN_LEAF_TOKENS: ${MIN_LEAF_TOKENS:-256}
      SPLIT_TOKENS: ${SPLIT_TOKENS:-4096}
    secrets:
    - processor_service_token
    - openrouter_api_key
    - qdrant_api_key
    depends_on:
      letfs:
        condition: service_healthy
    networks:
    - backend
    - outbound
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    stop_grace_period: 40s
  processor-io:
    <<: *processor
    command: [io]
    cpus: 1
    mem_limit: 1g

  envoy:
    restart: unless-stopped
    image: envoyproxy/envoy:v1.37.0@sha256:d9b4a70739d92b3e28cd407f106b0e90d55df453d7d87773efd22b4429777fe8
    command:
    - -c
    - /etc/envoy/openlet.json
    - --log-level
    - warn
    volumes:
    - ${OPENLET_STATE_DIR:-../../.local}/envoy.json:/etc/envoy/openlet.json:ro
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
    - account
    - workspace
    networks:
    - backend
    - outbound
  account:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/account/Dockerfile
    environment:
      <<: *telemetry-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
      DATABASE_URL_FILE: /run/secrets/account_database_url
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      CLERK_API_URL: ${CLERK_API_URL:-https://api.clerk.com/v1}
    secrets:
    - account_database_url
    - gateway_token
    - workspace_service_token
    - clerk_secret_key
    depends_on:
      temporal-init:
        condition: service_completed_successfully
      account-migrate:
        condition: service_completed_successfully
    networks:
    - backend
    - outbound
    stop_grace_period: 155s
    healthcheck:
      test:
      - CMD
      - /server
      - --healthcheck
      interval: 5s
      timeout: 5s
      retries: 20
  visibility-schema:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint:
    - /bin/sh
    - -ec
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
    - temporal_visibility_db_password
    environment:
      SQL_HOST: postgres
      SQL_PORT: '5432'
      SQL_PLUGIN: postgres12_pgx
      SQL_USER: openlet_temporal_visibility
      SQL_DATABASE: openlet_temporal_visibility
    command:
    - export SQL_PASSWORD="$$(cat /run/secrets/temporal_visibility_db_password)";
      temporal-sql-tool setup-schema -v 0.0; temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
  account-migrate:
    build:
      context: ../..
      dockerfile: infra/bootstrap/Dockerfile
    image: openlet-migrations:local
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - export GOOSE_DBSTRING="$$(cat "$${DATABASE_URL_FILE}")"; exec goose -dir /migrations
      up
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      DATABASE_URL_FILE: /run/secrets/account_database_url
    secrets:
    - account_database_url
    volumes:
    - ../../apps/account/migrations:/migrations:ro
  workspace-migrate:
    build:
      context: ../..
      dockerfile: infra/bootstrap/Dockerfile
    image: openlet-migrations:local
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - export GOOSE_DBSTRING="$$(cat "$${DATABASE_URL_FILE}")"; exec goose -dir /migrations
      up
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      DATABASE_URL_FILE: /run/secrets/workspace_database_url
    secrets:
    - workspace_database_url
    volumes:
    - ../../apps/workspace/migrations:/migrations:ro
  letfs-migrate:
    build:
      context: ../..
      dockerfile: infra/bootstrap/Dockerfile
    image: openlet-migrations:local
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - export GOOSE_DBSTRING="$$(cat "$${DATABASE_URL_FILE}")"; exec goose -dir /migrations
      up
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      DATABASE_URL_FILE: /run/secrets/letfs_database_url
    secrets:
    - letfs_database_url
    volumes:
    - ../../apps/letfs/migrations:/migrations:ro
networks:
  backend:
    internal: true
  outbound: {}
volumes:
  postgres-data: {}
  qdrant-data: {}
secrets:
  openrouter_api_key:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/openrouter_api_key
  qdrant_api_key:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/qdrant_api_key
  s3_access_key_id:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/s3_access_key_id
  s3_secret_access_key:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/s3_secret_access_key
  clerk_secret_key:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/clerk_secret_key
  postgres_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/postgres_password
  account_db_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/account_db_password
  workspace_db_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/workspace_db_password
  letfs_db_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/letfs_db_password
  temporal_db_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/temporal_db_password
  temporal_visibility_db_password:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/temporal_visibility_db_password
  account_database_url:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/account_database_url
  workspace_database_url:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/workspace_database_url
  letfs_database_url:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/letfs_database_url
  gateway_token:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/gateway_token
  workspace_service_token:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/workspace_service_token
  processor_service_token:
    file: ${OPENLET_STATE_DIR:-../../.local}/secrets/processor_service_token
