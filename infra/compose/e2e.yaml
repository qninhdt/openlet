name: openlet-api-e2e

x-go-environment: &go-environment
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: openlet
  ALLOW_PLAINTEXT_RPC: 'true'
  SPICEDB_ADDRESS: spicedb:50051
  SPICEDB_GRPC_PRESHARED_KEY_FILE: /run/secrets/spicedb_key
  GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
  WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token

x-model-environment: &model-environment
  OPENROUTER_URL: http://boundary:8080/api/v1
  OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
  OPENROUTER_EMBEDDING_MODEL: e2e-embedding
  OPENROUTER_GENERATION_MODEL: e2e-generation
  OPENROUTER_RERANK_MODEL: e2e-rerank
  EMBEDDING_DIMENSION: '8'
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: files
  QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
  ALLOW_LOCAL_AI: 'true'

x-labels: &labels
  openlet.e2e.run: ${OPENLET_E2E_RUN:?Run through Playwright setup}
  openlet.e2e.worktree: ${OPENLET_E2E_ROOT:?Run through Playwright setup}

x-temporal-schema: &temporal-schema
  image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
  entrypoint: [/bin/sh, -ec]
  labels: *labels
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}

x-application-migration: &application-migration
  build: {context: ../.., dockerfile: infra/bootstrap/Dockerfile}
  image: openlet-migrations:local
  entrypoint: [/bin/sh, -ec]
  command: ['export GOOSE_DBSTRING="$$(cat "$${DATABASE_URL_FILE}")"; exec goose -dir /migrations up']
  profiles: [setup]
  labels: *labels
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}

x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
services:
  spicedb-migrate:
    image: &spicedb-image authzed/spicedb:v1.57.0@sha256:2e0cd20aa923ccfd96eb285756ec10a5d7bbe387e4b29c26bd6447435d2328de
    working_dir: /config
    command: [datastore, migrate, head, --skip-release-check]
    volumes: ['${OPENLET_E2E_STATE}/spicedb.env:/config/spicedb.env:ro']
    depends_on:
      postgres: {condition: service_healthy}
    labels: *labels
    networks: [backend]

  spicedb:
    image: *spicedb-image
    working_dir: /config
    command:
      - serve
      - --skip-release-check
      - --telemetry-endpoint=
      - --http-enabled=false
      - --datastore-disable-watch-support
      - --datastore-conn-pool-read-min-open=1
      - --datastore-conn-pool-read-max-open=8
      - --datastore-conn-pool-write-min-open=1
      - --datastore-conn-pool-write-max-open=8
    volumes: ['${OPENLET_E2E_STATE}/spicedb.env:/config/spicedb.env:ro']
    depends_on:
      spicedb-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /usr/local/bin/grpc_health_probe, -addr=localhost:50051, -rpc-timeout=2s]
      interval: 2s
      timeout: 3s
      retries: 60
    stop_grace_period: 30s
    labels: *labels
    networks: [backend]

  authz-schema:
    build: {context: ../.., dockerfile: infra/bootstrap/Dockerfile}
    image: openlet-migrations:local
    entrypoint: [/usr/local/bin/authz-schema]
    environment:
      SPICEDB_ADDRESS: spicedb:50051
      SPICEDB_GRPC_PRESHARED_KEY_FILE: /run/secrets/spicedb_key
      ALLOW_PLAINTEXT_RPC: 'true'
    secrets: [spicedb_key]
    depends_on:
      spicedb: {condition: service_healthy}
    profiles: [setup]
    labels: *labels
    networks: [backend]

  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_USER: openlet_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql
      - ${OPENLET_E2E_STATE}/init.sql:/docker-entrypoint-initdb.d/10-applications.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, openlet_admin, -d, postgres]
      interval: 2s
      timeout: 3s
      retries: 60
    labels: *labels
    networks: [backend]

  account-migrate:
    <<: *application-migration
    environment: {GOOSE_DRIVER: postgres, DATABASE_URL_FILE: /run/secrets/account_database_url}
    secrets: [account_database_url]
    volumes: [../../apps/account/migrations:/migrations:ro]

  workspace-migrate:
    <<: *application-migration
    environment: {GOOSE_DRIVER: postgres, DATABASE_URL_FILE: /run/secrets/workspace_database_url}
    secrets: [workspace_database_url]
    volumes: [../../apps/workspace/migrations:/migrations:ro]

  letfs-migrate:
    <<: *application-migration
    environment: {GOOSE_DRIVER: postgres, DATABASE_URL_FILE: /run/secrets/letfs_database_url}
    secrets: [letfs_database_url]
    volumes: [../../apps/letfs/migrations:/migrations:ro]

  temporal-schema:
    <<: *temporal-schema
    secrets: [temporal_db_password]
    environment:
      SQL_HOST: postgres
      SQL_PORT: '5432'
      SQL_PLUGIN: postgres12_pgx
      SQL_USER: openlet_temporal
      SQL_DATABASE: openlet_temporal
    command:
      - >-
        export SQL_PASSWORD="$$(cat /run/secrets/temporal_db_password)";
        temporal-sql-tool setup-schema -v 0.0;
        temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned

  visibility-schema:
    <<: *temporal-schema
    secrets: [temporal_visibility_db_password]
    environment:
      SQL_HOST: postgres
      SQL_PORT: '5432'
      SQL_PLUGIN: postgres12_pgx
      SQL_USER: openlet_temporal_visibility
      SQL_DATABASE: openlet_temporal_visibility
    command:
      - >-
        export SQL_PASSWORD="$$(cat /run/secrets/temporal_visibility_db_password)";
        temporal-sql-tool setup-schema -v 0.0;
        temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    entrypoint: [temporal-server, --config-file, /config/openlet.json, --allow-no-auth, start]
    volumes: ["${OPENLET_E2E_STATE}/temporal.json:/config/openlet.json:ro"]
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
      visibility-schema: {condition: service_completed_successfully}
    labels: *labels
    networks: [backend]

  temporal-init:
    <<: *temporal-schema
    profiles: [setup]
    entrypoint: [temporal]
    environment: {TEMPORAL_ADDRESS: 'temporal:7233'}
    command: [operator, namespace, create, --namespace, openlet, --retention, 168h]

  storage:
    build: {context: ../minio}
    image: openlet-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_access_key
    secrets: [s3_access_key_id, s3_secret_access_key]
    volumes: [storage:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 60
    labels: *labels
    networks: [backend]

  boundary:
    image: node:24.21.0-slim
    command: [node, /fixtures/boundary-server.ts]
    volumes: [../../e2e/fixtures:/fixtures:ro]
    secrets: [fixture_control_token, clerk_secret_key, openrouter_api_key]
    ports:
      - 127.0.0.1:${OPENLET_E2E_CONTROL_PORT}:8080
      - 127.0.0.1:${OPENLET_E2E_STORAGE_PORT}:9000
    labels: *labels
    networks: [backend, ingress]

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    entrypoint: [/bin/sh, -ec]
    command: ['export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_api_key)"; exec ./entrypoint.sh']
    secrets: [qdrant_api_key]
    volumes: [qdrant:/qdrant/storage]
    labels: *labels
    networks: [backend]

  account:
    depends_on:
      spicedb: {condition: service_healthy}
    build: {context: ../.., dockerfile: apps/account/Dockerfile}
    environment:
      <<: [*telemetry-env, *go-environment]
      DATABASE_URL_FILE: /run/secrets/account_database_url
      CLERK_API_URL: http://boundary:8080/v1
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      ALLOW_TEST_HTTP: 'true'
    secrets: [account_database_url, gateway_token, workspace_service_token, clerk_secret_key, spicedb_key]
    healthcheck: &go-health
      test: [CMD, /server, --healthcheck]
      interval: 2s
      timeout: 5s
      retries: 60
    stop_grace_period: 40s
    labels: *labels
    networks: [backend]

  workspace:
    depends_on:
      spicedb: {condition: service_healthy}
    build: {context: ../.., dockerfile: apps/workspace/Dockerfile}
    environment:
      <<: [*telemetry-env, *go-environment]
      DATABASE_URL_FILE: /run/secrets/workspace_database_url
      ACCOUNT_RPC_ADDRESS: account:9090
      LETFS_RPC_ADDRESS: letfs:9090
      DEFAULT_QUOTA_BYTES: '20971520'
    secrets: [workspace_database_url, gateway_token, workspace_service_token, spicedb_key]
    healthcheck: *go-health
    stop_grace_period: 40s
    labels: *labels
    networks: [backend]

  letfs:
    depends_on:
      spicedb: {condition: service_healthy}
    build: {context: ../.., dockerfile: apps/letfs/Dockerfile}
    environment:
      <<: [*telemetry-env, *model-environment, *go-environment]
      DATABASE_URL_FILE: /run/secrets/letfs_database_url
      WORKSPACE_SERVICE_TOKEN_FILE: /run/secrets/workspace_service_token
      INGEST_SERVICE_TOKEN_FILE: /run/secrets/ingest_service_token
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      S3_ENDPOINT: http://boundary:9000
      S3_SIGNING_ENDPOINT: http://127.0.0.1:${OPENLET_E2E_STORAGE_PORT}
      S3_REGION: us-east-1
      S3_BUCKET: openlet-e2e
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      ALLOW_LOCAL_S3: 'true'
      MAX_COPY_NODES: '64'
    secrets: [letfs_database_url, gateway_token, spicedb_key, workspace_service_token, ingest_service_token, openrouter_api_key, qdrant_api_key, s3_access_key_id, s3_secret_access_key]
    healthcheck:
      test: [CMD, /server, --healthcheck]
      interval: 2s
      timeout: 5s
      retries: 60
    stop_grace_period: 40s
    labels: *labels
    networks: [backend]

  ingest-cpu: &ingest
    command: [cpu]
    build: {context: ../.., dockerfile: apps/letfs-ingest/Dockerfile}
    environment:
      <<: [*telemetry-env, *model-environment]
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: openlet
      LETFS_RPC_ADDRESS: letfs:9090
      ALLOW_PLAINTEXT_RPC: 'true'
      INGEST_SERVICE_TOKEN_FILE: /run/secrets/ingest_service_token
    secrets: [ingest_service_token, openrouter_api_key, qdrant_api_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1g,mode=1777"]
    stop_grace_period: 40s
    labels: *labels
    networks: [backend]

  ingest-io:
    <<: *ingest
    command: [io]
    cpus: 1
    mem_limit: 1g

  envoy:
    image: envoyproxy/envoy:v1.37.0@sha256:d9b4a70739d92b3e28cd407f106b0e90d55df453d7d87773efd22b4429777fe8
    command: [-c, /etc/envoy/openlet.json, --log-level, warn, --concurrency, '1']
    volumes: ["${OPENLET_E2E_STATE}/envoy.json:/etc/envoy/openlet.json:ro"]
    ports: ["127.0.0.1:${OPENLET_E2E_GATEWAY_PORT}:8080"]
    labels: *labels
    networks: [backend, ingress]

networks:
  backend: {internal: true, labels: *labels}
  ingress: {labels: *labels}
volumes:
  postgres: {labels: *labels}
  storage: {labels: *labels}
  qdrant: {labels: *labels}
secrets:
  spicedb_key: {file: '${OPENLET_E2E_STATE}/secrets/spicedb_key'}
  postgres_password: {file: '${OPENLET_E2E_STATE}/secrets/postgres_password'}
  temporal_db_password: {file: '${OPENLET_E2E_STATE}/secrets/temporal_db_password'}
  temporal_visibility_db_password: {file: '${OPENLET_E2E_STATE}/secrets/temporal_visibility_db_password'}
  account_database_url: {file: '${OPENLET_E2E_STATE}/secrets/account_database_url'}
  workspace_database_url: {file: '${OPENLET_E2E_STATE}/secrets/workspace_database_url'}
  letfs_database_url: {file: '${OPENLET_E2E_STATE}/secrets/letfs_database_url'}
  gateway_token: {file: '${OPENLET_E2E_STATE}/secrets/gateway_token'}
  workspace_service_token: {file: '${OPENLET_E2E_STATE}/secrets/workspace_service_token'}
  ingest_service_token: {file: '${OPENLET_E2E_STATE}/secrets/ingest_service_token'}
  clerk_secret_key: {file: '${OPENLET_E2E_STATE}/secrets/clerk_secret_key'}
  fixture_control_token: {file: '${OPENLET_E2E_STATE}/secrets/fixture_control_token'}
  openrouter_api_key: {file: '${OPENLET_E2E_STATE}/secrets/openrouter_api_key'}
  qdrant_api_key: {file: '${OPENLET_E2E_STATE}/secrets/qdrant_api_key'}
  s3_access_key_id: {file: '${OPENLET_E2E_STATE}/secrets/s3_access_key_id'}
  s3_secret_access_key: {file: '${OPENLET_E2E_STATE}/secrets/s3_secret_access_key'}
