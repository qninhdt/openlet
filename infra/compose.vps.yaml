services:
  platform: {restart: unless-stopped, mem_limit: 192m}
  letfs: {restart: unless-stopped, mem_limit: 256m}
  ingest-cpu: {restart: unless-stopped, mem_limit: 2g, cpus: 2}
  ingest-io: {restart: unless-stopped, mem_limit: 512m}
  leta-api: {restart: unless-stopped, mem_limit: 512m}
  leta-worker: {restart: unless-stopped, mem_limit: 512m}
  postgres: {restart: unless-stopped, mem_limit: 512m}
  spicedb: {restart: unless-stopped, mem_limit: 384m}
  temporal: {restart: unless-stopped, mem_limit: 768m}
  qdrant: {restart: unless-stopped, mem_limit: 512m}
  litellm: {restart: unless-stopped, mem_limit: 768m}
  redis: {restart: unless-stopped, mem_limit: 128m}
  alloy: {restart: unless-stopped, mem_limit: 256m}
  envoy: {restart: unless-stopped, mem_limit: 128m}
  cloudflared:
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    command: [tunnel, --no-autoupdate, --protocol, http2, run, --token-file, /etc/cloudflared/token]
    volumes: [/opt/openlet/tunnel.token:/etc/cloudflared/token:ro]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    depends_on:
      envoy: {condition: service_healthy}
