[package]
name = "letfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["full"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
subtle = "2"
url = "2"
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-sdk = { version = "=1.1.0", default-features = false, features = ["experimental", "opentelemetry"] }
reqwest = { version = "=0.13.5", features = ["json"] }
object_store = { version = "=0.14.2", default-features = false, features = ["aws", "tokio"] }
sha2 = "0.10"
bytes = "1"
temporalio-macros = "=1.1.0"
futures = "0.3"
temporalio-workflow = "=1.1.0"
aws-sigv4 = "=1.6.4"
aws-credential-types = "=1.3.1"
base64 = "=0.22.1"
md-5 = "=0.11.0"
async_zip = { version = "=0.0.19", features = ["tokio"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "reqwest-blocking-client", "tls-roots"] }
opentelemetry-http = { version = "=0.32.0", default-features = false }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-serde = "=0.2.0"
reqwest-middleware = { version = "=0.5.2", features = ["json"] }
reqwest-tracing = { version = "=0.7.1", features = ["opentelemetry_0_32"] }
unicode-normalization = "=0.1.26"

[dev-dependencies]
opentelemetry_sdk = { version = "=0.32.0", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
prost = "=0.14.4"
testcontainers = { version = "=0.28.0", default-features = false }
