[project]
name = "letfs-ingest"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "openlet-sdk", "httpx", "litellm==1.109.1", "instructor", "pydantic", "qdrant-client",
  "google-crc32c", "langchain-text-splitters", "pillow", "markdown-it-py",
]

[project.optional-dependencies]
cpu = ["docling[rapidocr]>=2.150.0", "openpyxl", "torch", "torchvision"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letfs_ingest"]

[tool.uv.sources]
openlet-sdk = { workspace = true }
instructor = { git = "https://github.com/567-labs/instructor.git", rev = "aeb7e2558166caeec497e541bcfc6b4eaa2cf53b" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
