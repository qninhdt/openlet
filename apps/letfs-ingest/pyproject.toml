[project]
name = "letfs-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openlet-python",
  "docling[rapidocr]==2.144.0",
  "httpx==0.28.1",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "langchain-text-splitters==1.1.2",
  "instructor==1.17.0",
  "openai==3.3.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.0", "ruff==0.17.3", "reportlab==4.4.10"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.uv.sources]
openlet-python = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["parser: runs the real pinned Docling parser"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/letfs_ingest"]
