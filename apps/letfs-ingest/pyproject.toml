[project]
name = "letfs-ingest"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "openlet-python",
  "pydantic==2.14.3",
  "docling[rapidocr]==2.148.0",
  "httpx==0.28.1",
  "torch==2.15.0",
  "torchvision==0.29.1",
  "langchain-text-splitters==1.1.3",
  "instructor==1.17.0",
  "openai==3.3.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4", "reportlab==5.1.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
openlet-python = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["parser: runs the real pinned Docling parser"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/letfs_ingest"]
