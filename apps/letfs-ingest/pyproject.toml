[project]
name = "letfs-ingest"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "openlet-sdk", "boto3", "httpx", "litellm==1.109.1", "instructor", "pydantic", "qdrant-client",
  "google-crc32c", "langchain-text-splitters", "pillow", "markdown-it-py", "tiktoken",
]

[project.optional-dependencies]
cpu = [
  "python-pptx",
  "openpyxl",
  "pypdf",
  "datalab-python-sdk>=0.10.0",
  "lxml>=6.1.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letfs_ingest"]

[tool.uv.sources]
openlet-sdk = { workspace = true }
instructor = { git = "https://github.com/567-labs/instructor.git", rev = "aeb7e2558166caeec497e541bcfc6b4eaa2cf53b" }
