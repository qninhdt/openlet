name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'apps/{platform,letfs}/**'
              - 'packages/{contracts,sdk-go}/**'
              - 'go.work*'
              - 'Makefile'
            python:
              - 'apps/{leta,letfs-ingest}/**'
              - 'packages/{contracts,sdk-python,env}/**'
              - 'tests/e2e/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'Makefile'
            contracts:
              - 'packages/contracts/**'
            web:
              - 'apps/web/**'
              - 'packages/contracts/file-types.json'
              - 'pnpm*'
              - 'package.json'
              - '.prettierrc'
              - '.prettierignore'
              - '.editorconfig'
              - '.github/workflows/ci.yaml'
              - 'Makefile'
            backend:
              - 'apps/{platform,letfs,letfs-ingest,leta}/**'
              - 'packages/{contracts,sdk-go,sdk-python,env}/**'
              - 'tests/e2e/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'Makefile'
              - 'go.work*'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.dockerignore'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_DB: letfs
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['127.0.0.1:15432:5432']
        options: --health-cmd "pg_isready -U postgres -d letfs" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            apps/platform/go.sum
            apps/letfs/go.sum
            packages/sdk-go/go.sum
      - name: Go format, vet, and unit tests
        run: make check-go test-go
      - name: SQL storage invariants
        env:
          OPENLET_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:15432/letfs?sslmode=disable
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://postgres:isolated-test-only@127.0.0.1:15432/letfs?sslmode=disable
          GOOSE_MIGRATION_DIR: apps/letfs/migrations
        run: |
          curl -fsSL "https://github.com/pressly/goose/releases/download/v3.27.0/goose_linux_x86_64" -o /tmp/goose
          echo "ad487c23744ae5de5dbdf5a81d4e6fac05fdfbe74f02379f9e498cf2070a9ef8  /tmp/goose" | sha256sum -c -
          chmod +x /tmp/goose
          /tmp/goose up
          make integration

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.backend == 'true'
        with:
          go-version: '1.27.4'
      - name: Python lint, typecheck, and unit tests
        run: make check-python test-python
      - name: Shell and workflow lint
        if: needs.changes.outputs.backend == 'true'
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            apps/platform/go.sum
            apps/letfs/go.sum
            packages/sdk-go/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true
      - name: Verify protobuf generation and lint
        run: |
          make tools generate
          buf lint packages/contracts
          git diff --exit-code -- packages/sdk-go/gen packages/sdk-python/src/openlet_api packages/sdk-python/src/buf packages/contracts/generated

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pnpm and cache store
        run: |
          npm install --global pnpm@12.18.0
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            pnpm --filter @openlet/web exec playwright install-deps chromium
          else
            pnpm --filter @openlet/web exec playwright install --with-deps chromium
          fi
      - name: Format, typecheck, lint, unit tests, and build
        run: make check-js
      - name: Browser UI E2E tests
        run: pnpm --filter @openlet/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e
          path: .local/e2e/ui/
          if-no-files-found: ignore
          retention-days: 7

  backend-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      OPENLET_E2E_PROJECT: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure sufficient free disk space
        run: |
          avail_gb=$(df -BG --output=avail /var/lib/docker | tail -n1 | tr -dc '0-9')
          echo "Available disk on /var/lib/docker: ${avail_gb}G"
          if (( avail_gb < 25 )) && [[ -n "${ANDROID_HOME:-}" && -d "$ANDROID_HOME" ]]; then
            sudo rm -rf -- "$ANDROID_HOME"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure Bake registry cache options
        id: bake-opts
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-cache"
          src="https://github.com/${GITHUB_REPOSITORY}"
          can_write="false"
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            can_write="true"
          fi
          {
            echo "set<<EOF"
            for pair in "platform:platform" "letfs:letfs" "ingest-cpu:letfs-ingest" "leta-api:leta"; do
              target="${pair%%:*}"
              cache_tag="${pair##*:}"
              echo "${target}.labels.org.opencontainers.image.source=${src}"
              echo "${target}.cache-from=type=registry,ref=${repo}:${cache_tag}"
              if [[ "$can_write" == "true" ]]; then
                echo "${target}.cache-to=type=registry,ref=${repo}:${cache_tag},mode=max,compression=zstd,ignore-error=true"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          OPENLET_CONFIG: ${{ github.workspace }}/infra/config/openlet.example.yaml
          OPENLET_GENERATED: ${{ github.workspace }}/.local/bake-generated
        with:
          source: infra
          files: compose.yaml
          load: true
          allow: fs.read=${{ github.workspace }}
          targets: |
            platform
            letfs
            ingest-cpu
            leta-api
          set: ${{ steps.bake-opts.outputs.set }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .local/uv-cache
          key: openlet-tools-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: openlet-tools-uv-${{ runner.os }}-
      - name: Run parallel API E2E suite
        run: |
          mkdir -p .local/e2e
          uv run --no-env-file --locked pytest -n 4 tests/e2e --junitxml=.local/e2e/junit.xml
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p .local/e2e
          uv run --no-env-file --locked openlet-env logs --project "$OPENLET_E2E_PROJECT" --tail 200 > .local/e2e/compose.log 2>&1 || true
          uv run --no-env-file --locked openlet-env down --project "$OPENLET_E2E_PROJECT" --volumes --remove-state || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-e2e
          path: .local/e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Push tested images and build release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"
          tag="sha-${short_sha}"
          printf 'services:\n' > image-lock.yaml
          for image in platform letfs letfs-ingest leta; do
            ref="${repo}-${image}:${tag}"
            docker tag "openlet/${image}:local" "$ref"
            push_log=$(docker push "$ref")
            printf '%s\n' "$push_log"
            digest=$(awk -v t="${tag}:" '$1 == t && $2 == "digest:" {print $3}' <<< "$push_log")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            pinned="${ref%:*}@${digest}"
            case "$image" in
              platform)
                printf '  platform: {image: "%s"}\n  platform-migrate: {image: "%s"}\n' "$pinned" "$pinned" >> image-lock.yaml
                ;;
              letfs)
                printf '  letfs: {image: "%s"}\n  letfs-migrate: {image: "%s"}\n' "$pinned" "$pinned" >> image-lock.yaml
                ;;
              letfs-ingest)
                printf '  ingest-cpu: {image: "%s"}\n  ingest-io: {image: "%s"}\n' "$pinned" "$pinned" >> image-lock.yaml
                ;;
              leta)
                printf '  leta-api: {image: "%s"}\n  leta-worker: {image: "%s"}\n  leta-migrate: {image: "%s"}\n' "$pinned" "$pinned" "$pinned" >> image-lock.yaml
                ;;
            esac
          done
          mkdir -p .local
          tar -czf .local/release.tgz \
            image-lock.yaml \
            infra \
            scripts \
            packages/contracts/authz \
            packages/contracts/generated \
            packages/contracts/file-types.json \
            packages/sdk-python/pyproject.toml \
            packages/sdk-python/src \
            packages/env/pyproject.toml \
            apps/letfs-ingest/pyproject.toml \
            apps/leta/pyproject.toml \
            pyproject.toml \
            uv.lock \
            .python-version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-bundle
          path: .local/release.tgz
          if-no-files-found: error
          retention-days: 30

  deploy-vps:
    needs: [changes, go, python, contracts, backend-e2e]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend-e2e.result == 'success' &&
      (needs.go.result == 'success' || needs.go.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.contracts.result == 'success' || needs.contracts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openlet
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: .local
      - name: Transfer and activate release on VPS
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          release="/opt/openlet/releases/$GITHUB_SHA"
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          scp .local/release.tgz "$DEPLOY_USER@$DEPLOY_HOST:$release/release.tgz"
          # shellcheck disable=SC2029
          printf '%s' "$GH_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$release' && tar -xzf release.tgz && sudo -n env UV=\"\$HOME/.local/bin/uv\" COMPOSE_PROJECT_NAME=openlet COMPOSE_PROFILES=leta,observability OPENLET_STATE_DIR=/opt/openlet OPENLET_BACKUPS=/opt/openlet/backups scripts/deploy.sh /opt/openlet/openlet.yaml /opt/openlet/.env '$release/image-lock.yaml' '$GITHUB_ACTOR'"
      - name: Verify public API via Cloudflare Tunnel
        run: |
          for attempt in {1..12}; do
            status=$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' https://openlet-api.qninhdt.com/v1/workspaces) || status=000
            if [[ $status == 401 ]]; then exit 0; fi
            echo "API check $attempt returned HTTP $status"
            sleep 5
          done
          exit 1

  deploy-web:
    needs: [changes, web, deploy-vps]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true' &&
      needs.web.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.deploy-vps.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openlet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Build frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile
          node --test apps/web/worker.test.mjs
          pnpm build
      - name: Deploy Cloudflare Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.164.0 deploy --message "$GITHUB_SHA"
      - name: Verify public frontend
        run: curl --retry 6 --retry-all-errors --max-time 15 -fsS https://openlet.qninhdt.com/ -o /dev/null
